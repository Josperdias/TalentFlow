# TalentFlow People — servidor (API + PostgreSQL). Uso: cp .env.example .env && editar .env && docker compose up -d --build
# O site (ZIP) é publicado à parte no seu servidor web; veja docs/DEPLOY-SERVIDOR.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-talentflow}
      POSTGRES_USER: ${PGUSER:-talentflow}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Defina PGPASSWORD no arquivo .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-talentflow} -d ${PGDATABASE:-talentflow}"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ../services/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # exposto só localmente; o proxy reverso (Nginx/Apache) publica /api com HTTPS
    environment:
      DATABASE_URL: postgresql+psycopg://${PGUSER:-talentflow}:${PGPASSWORD}@db:5432/${PGDATABASE:-talentflow}
      APP_ENV: production
      DEMO_SEED: "false"
      COOKIE_SECURE: "true"
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TF_UPDATES_DIR: /updates
      # Atualização automática pelas Releases do GitHub (opcional). Token só para repositório privado, somente leitura, só no servidor.
      TF_UPDATES_GITHUB_REPO: ${TF_UPDATES_GITHUB_REPO:-}
      TF_UPDATES_GITHUB_TOKEN: ${TF_UPDATES_GITHUB_TOKEN:-}
      TF_UPDATES_PRERELEASES: ${TF_UPDATES_PRERELEASES:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/private_uploads
      - ./updates:/updates:ro   # instalador do Windows + windows.json (veja docs/ATUALIZACAO.md)
volumes:
  pg_data:
  uploads:
