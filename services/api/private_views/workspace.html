/* Gestão por competências — interface mobile-first, sem dependências externas */
.cLead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.cNotice{border:1px solid #ded8ff;background:#f5f2ff;color:#53448e;border-radius:12px;padding:12px 15px;font-size:11px;line-height:1.6;margin:0 0 17px}
.cTabs{display:flex;align-items:center;gap:6px;overflow-x:auto;margin:16px 0;max-width:100%;padding-bottom:5px}

.cTabs button.active{background:#6754d4;border-color:#6754d4;color:white}
.cFilters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:15px;background:white;border:1px solid #e7eaf2;border-radius:12px;margin-bottom:16px}

.cFilters select{padding:9px 8px;border:1px solid #dfe2ed;border-radius:7px;background:#fff;color:#26314a;min-width:0}

.cKpi{padding:17px;min-height:118px}.cKpi .number{font-size:25px;font-weight:850;letter-spacing:-.06em;margin:9px 0 3px}.cKpi small{font-size:10px;color:#77849a}.cKpi .detail{font-size:10px}
.cGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-bottom:16px}
.cChartRow{display:grid;grid-template-columns:minmax(95px,1fr) minmax(65px,3fr) 44px;align-items:center;gap:10px;margin:13px 0;font-size:11px}
.cChartRow label{color:#4a5670;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cChartRow .cTrack{height:11px;background:#eff0f8;border-radius:10px;overflow:hidden}
.cChartRow .cFill{height:100%;background:linear-gradient(90deg,#5b51cc,#a08aff);border-radius:10px}
.cChartRow strong{font-variant-numeric:tabular-nums;text-align:right}

.cHeat{border-collapse:collapse;font-size:11px;width:100%;min-width:620px}.cHeat th,.cHeat td{padding:10px 10px;border-bottom:1px solid #edf0f6;text-align:center;min-width:74px}
.cHeat th:first-child,.cHeat td:first-child{text-align:left;min-width:195px;position:sticky;left:0;background:#fff;z-index:1}
.cHeat th{background:#f8f8fc;font-size:10px;color:#7c879b}.cHeat th:first-child{background:#f8f8fc;z-index:2}
