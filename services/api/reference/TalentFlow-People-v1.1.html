/* Gestão por competências — interface mobile-first, sem dependências externas */
.cLead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.cNotice{border:1px solid #ded8ff;background:#f5f2ff;color:#53448e;border-radius:12px;padding:12px 15px;font-size:11px;line-height:1.6;margin:0 0 17px}
.cTabs{display:flex;align-items:center;gap:6px;overflow-x:auto;margin:16px 0;max-width:100%;padding-bottom:5px}

.cTabs button.active{background:#6754d4;border-color:#6754d4;color:white}
.cFilters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:15px;background:white;border:1px solid #e7eaf2;border-radius:12px;margin-bottom:16px}

.cFilters select{padding:9px 8px;border:1px solid #dfe2ed;border-radius:7px;background:#fff;color:#26314a;min-width:0}

.cKpi{padding:17px;min-height:118px}.cKpi .number{font-size:25px;font-weight:850;letter-spacing:-.06em;margin:9px 0 3px}.cKpi small{font-size:10px;color:#77849a}.cKpi .detail{font-size:10px}
.cGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-bottom:16px}
.cChartRow{display:grid;grid-template-columns:minmax(95px,1fr) minmax(65px,3fr) 44px;align-items:center;gap:10px;margin:13px 0;font-size:11px}
.cChartRow label{color:#4a5670;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cChartRow .cTrack{height:11px;background:#eff0f8;border-radius:10px;overflow:hidden}
.cChartRow .cFill{height:100%;background:linear-gradient(90deg,#5b51cc,#a08aff);border-radius:10px}
.cChartRow strong{font-variant-numeric:tabular-nums;text-align:right}

.cHeat{border-collapse:collapse;font-size:11px;width:100%;min-width:620px}.cHeat th,.cHeat td{padding:10px 10px;border-bottom:1px solid #edf0f6;text-align:center;min-width:74px}
.cHeat th:first-child,.cHeat td:first-child{text-align:left;min-width:195px;position:sticky;left:0;background:#fff;z-index:1}
.cHeat th{background:#f8f8fc;font-size:10px;color:#7c879b}.cHeat th:first-child{background:#f8f8fc;z-index:2}

/* TalentFlow People analytics v0.7 — sem dependências externas */
const analyticsFilters={period:'all',department:'all',job:'all',source:'all'};
let analyticsTab='recruitment';
const aNumber=new Intl.NumberFormat('pt-BR');
const afmt=n=>aNumber.format(Number(n)||0);
const aratio=(n,d)=>d?Math.round(n/d*1000)/10:null;
const apercent=v=>v===null?'—':v.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const aMonth=x=>String(x||'').slice(0,7);
const aTitle=x=>x==='all'?'Todos':String(x);
const aCutoff=()=>{
  const days={d30:30,d90:90,d180:180,d365:365}[analyticsFilters.period];
  if(!days)return null;
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-days);
  return d.toISOString().slice(0,10);
};
const aInPeriod=created=>!aCutoff()||(String(created||'').slice(0,10)>=aCutoff()&&String(created||'').slice(0,10)<=today());
function analyticsScope(){
  const dept=analyticsFilters.department,jid=analyticsFilters.job,source=analyticsFilters.source;
  const jobs=state.jobs.filter(j=>(dept==='all'||j.department===dept)&&(jid==='all'||String(j.id)===jid));
  const ids=new Set(jobs.map(j=>j.id));
  const candidates=new Map(state.candidates.map(c=>[c.id,c]));
  const apps=state.applications.filter(a=>ids.has(a.job_id)&&aInPeriod(a.created_at)&&(source==='all'||candidates.get(a.candidate_id)?.source===source));
  const appIds=new Set(apps.map(a=>a.id));
  const employees=state.employees.filter(e=>dept==='all'||e.department===dept);
  const employeeIds=new Set(employees.map(e=>e.id));
  const onboarding=state.onboarding_items.filter(t=>employeeIds.has(t.employee_id));
  const learning=state.learning_enrollments.filter(x=>employeeIds.has(x.employee_id));
  const goals=state.performance_goals.filter(x=>employeeIds.has(x.employee_id));
  const pdis=state.development_plans.filter(x=>employeeIds.has(x.employee_id));
  const leave=state.leave_requests.filter(x=>employeeIds.has(x.employee_id));
  const interviews=state.interviews.filter(x=>appIds.has(x.application_id));
  const activeEmployees=employees.filter(x=>x.status==='active');
  return {jobs,apps,candidates,employees,activeEmployees,employeeIds,onboarding,learning,goals,pdis,leave,interviews};
}
const aSum=(arr,fn)=>arr.reduce((total,x)=>total+fn(x),0);
function aDetails(){
 const s=analyticsScope();
 const count=s.apps.length;
 const hired=s.apps.filter(a=>a.status==='hired').length;
 const dismissed=s.apps.filter(a=>a.status==='rejected').length;
 const active=s.apps.filter(a=>a.status==='active').length;
 const doneOn=s.onboarding.filter(x=>!!x.completed_at).length;
 const doneTraining=s.learning.filter(x=>x.status==='completed').length;
 const goalsDone=s.goals.filter(x=>Number(x.actual_value)>=Number(x.target_value)).length;
 const pdiDone=aSum(s.pdis,p=>aSum(p.actions||[],a=>a.done?1:0));
 const pdiTotal=aSum(s.pdis,p=>(p.actions||[]).length);
 const stageNames={}; s.apps.forEach(a=>{const key=stageFor(a)?.name||'Etapa desconhecida';stageNames[key]=(stageNames[key]||0)+1});
 const sourceNames={}; s.apps.forEach(a=>{const c=s.candidates.get(a.candidate_id);const key=c?.source||'Não informado';sourceNames[key]=(sourceNames[key]||0)+1});
 const monthly={};s.apps.forEach(a=>{const m=aMonth(a.created_at);if(/^\d{4}-\d\d$/.test(m))monthly[m]=(monthly[m]||0)+1});
 const departments={};s.activeEmployees.forEach(e=>departments[e.department]=(departments[e.department]||0)+1);
 const hiredBySource={};s.apps.filter(x=>x.status==='hired').forEach(a=>{const source=s.candidates.get(a.candidate_id)?.source||'Não informado';hiredBySource[source]=(hiredBySource[source]||0)+1});
 const dueNow=state.jobs.filter(j=>j.status==='open'&&(analyticsFilters.department==='all'||j.department===analyticsFilters.department)&&(analyticsFilters.job==='all'||String(j.id)===analyticsFilters.job)&&j.due_date&&j.due_date<today()).length;
 return {s,count,hired,dismissed,active,doneOn,doneTraining,goalsDone,pdiDone,pdiTotal,stageNames,sourceNames,monthly,departments,hiredBySource,dueNow};
}

 const depts=[...new Set([...state.jobs.map(j=>j.department),...state.employees.map(e=>e.department)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const jobs=state.jobs.filter(j=>analyticsFilters.department==='all'||j.department===analyticsFilters.department);
 const sources=[...new Set(state.candidates.map(x=>x.source).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

 return `<section class="analyticsFilters panel"><div class="filterHeading"><strong>Filtros do painel</strong><span>Atualização imediata · fonte: registros locais</span></div><div class="filterGrid">${select('period',[['all','Todo o histórico'],['d30','Últimos 30 dias'],['d90','Últimos 90 dias'],['d180','Últimos 180 dias'],['d365','Últimos 365 dias']])}${select('department',[['all','Todas as áreas'],...depts.map(d=>[d,d])])}${select('job',[['all','Todas as vagas'],...jobs.map(j=>[j.id,j.title])])}${select('source',[['all','Todas as origens'],...sources.map(v=>[v,v])])}</div><div class="filterHelp">O período, a vaga e a origem filtram candidaturas por data de inscrição. A área filtra também os registros atuais de colaboradores, integração, treinamento e desempenho. Esses últimos são <strong>retratos do banco atual</strong>, não séries históricas.</div></section>`;
}

function aChartBars(entries,opts={}){
 const total=entries.reduce((a,[_k,v])=>a+Number(v),0),max=Math.max(1,...entries.map(x=>Number(x[1])));
 if(!entries.length)return '<div class="empty">Nenhum registro para este recorte.</div>';
 return `<div class="aBars" role="group" aria-label="${esc(opts.label||'Distribuição por categoria')}">${entries.map(([k,n])=>{
  const width=Math.max(0,Number(n)/max*100);
  return `<button class="aBar" type="button" data-action="analytics-drill" data-drill="${esc(opts.drill||'stage')}" data-value="${esc(k)}" title="Abrir registros de ${esc(k)}: ${n}"><span class="aBarLabel">${esc(k)}</span><span class="aTrack"><span class="aBarFill" style="width:${width}%"></span></span><strong>${afmt(n)}</strong></button>`
 }).join('')}</div><div class="aChartCaption">Toque em uma barra para visualizar os registros que a compõem. Total: ${afmt(total)}.</div>`;
}
function aDonut(entries,label='Candidaturas'){
 const total=entries.reduce((t,x)=>t+Number(x[1]),0);
 if(!total)return '<div class="empty">Sem dados para o gráfico.</div>';
 const colors=['#6755d9','#30ad96','#e3a854','#db7181','#608bbf','#90a0bb'];
 let acc=0;const radius=68,circ=2*Math.PI*radius;
 const arcs=entries.map(([key,n],idx)=>{
  const segment=Number(n)/total*circ,offset=acc;acc+=segment;
  return `<circle class="aDonutSlice" cx="100" cy="100" r="${radius}" fill="none" stroke="${colors[idx%colors.length]}" stroke-width="24" stroke-dasharray="${Math.max(0,segment-.8)} ${circ}" stroke-dashoffset="${-offset}" transform="rotate(-90 100 100)" data-action="analytics-drill" data-drill="status" data-value="${esc(key)}" role="button" tabindex="0"><title>${esc(key)}: ${n} (${apercent(aratio(n,total))})</title></circle>`;
 }).join('');
 return `<div class="aDonutLayout"><svg viewBox="0 0 200 200" role="img" aria-label="Gráfico de distribuição de ${esc(label)}">${arcs}<text x="100" y="94" class="aDonutNumber">${afmt(total)}</text><text x="100" y="113" class="aDonutLabel">${esc(label)}</text></svg><div class="aLegend">${entries.map(([k,n],i)=>`<button data-action="analytics-drill" data-drill="status" data-value="${esc(k)}"><i style="background:${colors[i%colors.length]}"></i><span>${esc(k)}</span><strong>${apercent(aratio(n,total))}</strong></button>`).join('')}</div></div>`;
}
function aLine(monthly){
 const sorted=Object.entries(monthly).sort((a,b)=>a[0].localeCompare(b[0]));
 const toMonths=[];
 if(sorted.length){let [yy,mm]=sorted[0][0].split('-').map(Number);let [endY,endM]=sorted.at(-1)[0].split('-').map(Number);while((yy<endY||(yy===endY&&mm<=endM))&&toMonths.length<48){const key=`${yy}-${String(mm).padStart(2,'0')}`;toMonths.push([key,monthly[key]||0]);mm++;if(mm===13){yy++;mm=1}}}
 if(!toMonths.length)return '<div class="empty">Não existem inscrições com data neste período.</div>';
 const points=toMonths.slice(-12);const ymax=Math.max(1,...points.map(x=>x[1]));const left=48,right=20,top=22,bottom=41,W=720,H=230;
 const x=i=>left+(W-left-right)*i/Math.max(1,points.length-1),y=v=>H-bottom-(H-top-bottom)*v/ymax;

 const labels=points.map(([m,n],i)=>`<g><text x="${x(i)}" y="${H-13}" text-anchor="middle" class="aAxis">${m.slice(5)}/${m.slice(2,4)}</text><circle cx="${x(i)}" cy="${y(n)}" r="6" fill="#6755d9" stroke="white" stroke-width="3" role="button" tabindex="0" data-action="analytics-drill" data-drill="month" data-value="${m}"><title>${m}: ${n} candidaturas — abrir detalhes</title></circle></g>`).join('');
 return `<div class="aSvgScroller"><svg class="aLineSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Série temporal de candidaturas recebidas por mês. Ponto interativo abre registros do mês.">${grid}<polyline fill="none" points="${coords}" stroke="#6755d9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${labels}</svg></div><div class="aChartCaption">Mês da inscrição (não mês de contratação). Clique nos pontos para examinar os registros do mês.</div>`;
}

function aRecommendations(d){
 const {s,count,hired,doneTraining,doneOn,dueNow,goalsDone}=d;
 const items=[];
 if(count>0){
  const top=aSorted(d.stageNames).filter(([k])=>!/(contratad|reprovad)/i.test(k))[0];
  if(top)items.push(aInsight(`${top[0]} concentra ${top[1]} candidaturas`,'opportunity',`A etapa concentra ${apercent(aratio(top[1],count))} das inscrições visíveis. Isso descreve estoque, não prova gargalo: faltam datas de entrada e saída de cada etapa.`,'Revisar capacidade, distribuição e prazos por etapa antes de alterar o processo.'));
 }
 if(dueNow)items.push(aInsight(`${dueNow} vaga(s) aberta(s) com prazo vencido`,'risk','O prazo cadastrado é anterior à data atual do dispositivo. Isso não mede a duração real do recrutamento.','Revisar datas e responsáveis pelas vagas antes de redefinir SLAs.'));
 if(s.learning.length&&aratio(doneTraining,s.learning.length)<70)items.push(aInsight('Conclusão de treinamento abaixo de 70%','risk',`${doneTraining} de ${s.learning.length} matrículas foram concluídas. O nível de 70% é apenas um alerta configurado para a demonstração, não um corte científico.`,'Separar cursos obrigatórios e facultativos e investigar prazos e carga de trabalho.'));
 if(s.onboarding.length&&aratio(doneOn,s.onboarding.length)<85)items.push(aInsight('Atividades de integração ainda pendentes','opportunity',`${s.onboarding.length-doneOn} de ${s.onboarding.length} atividades permanecem abertas. Concluir tarefas não demonstra, isoladamente, integração eficaz.`,'Analisar tarefas pendentes por fase e combinar com pesquisas de adaptação bem construídas.'));
 if(!s.apps.some(a=>a.hired_at))items.push(aInsight('Tempo de contratação indisponível','quality','A base registra inscrições e status, mas não o marco confiável de aceite/contratação por candidatura.','Adicionar hired_at e histórico de transições antes de calcular time-to-hire e time-in-stage.'));
 if(!s.employees.some(e=>e.exited_at))items.push(aInsight('Taxa de turnover não calculável','quality','Existem registros de desligamento, porém faltam datas e exposição histórica de headcount por período.','Registrar datas de saída e snapshots mensais de efetivo para criar denominadores corretos.'));
 return `<div class="insightGrid">${items.slice(0,5).join('')}</div>`;
}

 'Especialista em Processos':[['Melhoria contínua',4,3],['Análise de dados',4,2],['Planejamento',4,2],['Comunicação clara',3,1],['Colaboração',3,1]],
 'Product Designer':[['Design de produto',4,3],['Pesquisa com usuários',4,3],['Comunicação clara',4,2],['Colaboração',3,1],['Planejamento',3,1]],
 'Analista Financeiro':[['Gestão financeira',4,3],['Excel e planilhas',4,3],['Análise de dados',4,2],['Planejamento',3,1],['Segurança da informação',2,1]],
 'Analista de Sucesso do Cliente':[['Atendimento consultivo',4,3],['Comunicação clara',4,3],['Resolução de problemas',4,2],['Colaboração',3,1],['Planejamento',3,1]]
};
const compUI={tab:'overview',department:'all',role:'all',category:'all',employeeId:1};
function compInit(){
 if(!Array.isArray(state.competencies))state.competencies=COMP_SEED.map((x,i)=>({id:i+1,name:x[0],category:x[1],description:x[2],active:true}));
 if(!Array.isArray(state.role_competencies)){
   state.role_competencies=[];
   for(const [role,rows] of Object.entries(COMP_PROFILES))for(const [name,level,weight] of rows){const item=state.competencies.find(c=>c.name===name);if(item)state.role_competencies.push({id:state.role_competencies.length+1,role,competency_id:item.id,level,weight});}
 }
 if(!Array.isArray(state.competency_assessments)){
   state.competency_assessments=[];
   const es=state.employees.filter(e=>e.status==='active');
   es.forEach((e,i)=>{
    if(i>=21)return;
    const reqs=state.role_competencies.filter(r=>r.role===e.job_title);
    reqs.forEach((r,j)=>{
      // Dados de demonstração: avaliações parciais para ressaltar ausência de evidência.
      if((i+j)%6===0)return;
      const variation=((i*2+j*3)%5===0?-2:((i+j)%4===0?-1:0));
      state.competency_assessments.push({id:state.competency_assessments.length+1,employee_id:e.id,competency_id:r.competency_id,level:Math.max(1,Math.min(5,r.level+variation)),date:'2026-09-'+String(4+(i%23)).padStart(2,'0'),method:'Observação estruturada (fictícia)',reviewer:'Gestor demonstrativo',evidence:'Evidência simulada para navegação; substituir por comportamento observado e documentação verificável.',demo:true});
    });
   });
 }
}
function compSkill(id){return (state.competencies||[]).find(x=>x.id===Number(id))}
function compEmployee(id){return state.employees.find(x=>x.id===Number(id))}
function compReq(emp){return state.role_competencies.filter(x=>x.role===emp.job_title && compSkill(x.competency_id)?.active!==false)}
function compLatest(empId,skillId){return state.competency_assessments.filter(a=>a.employee_id===Number(empId)&&a.competency_id===Number(skillId)).sort((a,b)=>String(b.date).localeCompare(String(a.date))||b.id-a.id)[0]||null}
function compRows(employees){return employees.flatMap(e=>compReq(e).map(r=>{const skill=compSkill(r.competency_id),assessment=compLatest(e.id,skill.id);return {employee:e,skill,required:r.level,weight:r.weight,assessment,observed:assessment?.level??null,gap:assessment?Math.max(0,r.level-assessment.level):null};}))}
function compFilteredEmployees(){return state.employees.filter(e=>e.status==='active'&&(compUI.department==='all'||e.department===compUI.department)&&(compUI.role==='all'||e.job_title===compUI.role))}
function compStats(employees=compFilteredEmployees(),category='all'){
 const rows=compRows(employees).filter(r=>category==='all'||r.skill.category===category),evaluated=rows.filter(x=>x.assessment),below=evaluated.filter(x=>x.gap>0),met=evaluated.filter(x=>x.gap===0),notAssessed=rows.length-evaluated.length;
 return {rows,evaluated,below,met,notAssessed,coverage:rows.length?Math.round(100*evaluated.length/rows.length):null,match:evaluated.length?Math.round(100*met.length/evaluated.length):null};
}
function compLevels(){return '<p class="cNotes"><strong>Escala interna de referência (1–5).</strong> 1 Inicial — requer apoio; 2 Básico — executa tarefas simples; 3 Autônomo — executa regularmente; 4 Avançado — resolve situações complexas; 5 Referência — orienta colegas. A escala é ilustrativa e exige rubricas específicas e calibração antes de uso real.</p>'}
function compBar(title,a,total,note=''){
 const val=total?Math.round(a/total*100):null;
 return `<div class="cChartRow" title="${esc(note||title)}"><label>${esc(title)}</label><div class="cTrack"><div class="cFill" style="width:${val??0}%"></div></div><strong>${total?val+'%':'N/D'}</strong></div>`;
}
function compFilterBar(){
 const depts=[...new Set(state.employees.filter(e=>e.status==='active').map(e=>e.department))].sort();
 const roles=[...new Set(state.employees.filter(e=>e.status==='active'&&(compUI.department==='all'||e.department===compUI.department)).map(e=>e.job_title))].sort();
 const sels=[['department','Departamento',[['all','Todas as áreas'],...depts.map(x=>[x,x])]],['role','Cargo',[['all','Todos os cargos'],...roles.map(x=>[x,x])]],['category','Categoria',[['all','Todas as categorias'],...[...new Set(state.competencies.map(x=>x.category))].map(x=>[x,x])]]];
 return `<div class="cFilters">${sels.map(([k,title,opts])=>`<label>${title}<select data-comp-filter="${k}">${opts.map(([v,label])=>`<option value="${esc(v)}" ${compUI[k]===v?'selected':''}>${esc(label)}</option>`).join('')}</select></label>`).join('')}</div>`;
}
function compKpi(title,n,foot){return `<div class="panel cKpi"><small>${esc(title)}</small><div class="number">${esc(n)}</div><div class="detail">${esc(foot)}</div></div>`}
function compSummary(){const employees=compFilteredEmployees(),s=compStats(employees,compUI.category),byDepartment={};
 for(const e of employees){const z=compStats([e],compUI.category);const d=e.department;if(!byDepartment[d])byDepartment[d]={assessed:0,total:0,below:0};byDepartment[d].assessed+=z.evaluated.length;byDepartment[d].total+=z.rows.length;byDepartment[d].below+=z.below.length;}
 const bySkill={};for(const r of s.rows){if(compUI.category!=='all'&&r.skill.category!==compUI.category)continue;const key=r.skill.name;if(!bySkill[key])bySkill[key]={n:0,assessed:0,below:0,missing:0,id:r.skill.id};bySkill[key].n++;if(r.assessment){bySkill[key].assessed++;if(r.gap>0)bySkill[key].below++;}else bySkill[key].missing++;}
 const risks=Object.entries(bySkill).filter(([_,v])=>v.below>0).sort((a,b)=>b[1].below-a[1].below).slice(0,6);
 return `<div class="cKpis">${compKpi('Pessoas no recorte',employees.length,'Somente colaboradores ativos')}${compKpi('Cobertura das avaliações',s.coverage===null?'N/D':s.coverage+'%',`${s.evaluated.length} de ${s.rows.length} requisitos avaliados`)}${compKpi('Lacunas identificadas',s.below.length,'Requisitos avaliados abaixo do nível requerido')}${compKpi('Requisitos atendidos',s.match===null?'N/D':s.match+'%',`${s.met.length} de ${s.evaluated.length} requisitos avaliados`)}</div>
 <div class="cGrid">${panel('Cobertura por departamento',Object.entries(byDepartment).map(([k,v])=>compBar(k,v.assessed,v.total,`${v.assessed}/${v.total} requisitos avaliados`)).join('')||'<div class="empty">Sem registros</div>','Cobertura, não nível de competência')}${panel('Lacunas por competência',risks.map(([k,v])=>`<div class="cRow"><div><strong>${esc(k)}</strong><p>${v.below} lacunas entre ${v.assessed} avaliações · ${v.missing} sem avaliação</p></div>${btn('Ver matriz','comp-go-matrix','ghost small',`data-skill="${v.id}"`)}</div>`).join('')||'<p class="muted">Não há lacunas registradas neste recorte. Verifique a cobertura antes de concluir adequação.</p>','Sinal de investigação, não ranking de pessoas')}</div>
 <div class="cNotice"><strong>Leitura responsável:</strong> níveis são registrados com evidência e não inferidos automaticamente. A conclusão de um curso ou PDI não eleva a nota de competência sem nova avaliação. Dados são fictícios; ausência de avaliação é N/D, nunca nível zero.</div>`;
}
function compMatrix(){const employees=compFilteredEmployees();const skills=state.competencies.filter(c=>c.active!==false&&(compUI.category==='all'||c.category===compUI.category));const relevant=skills.filter(s=>employees.some(e=>compReq(e).some(r=>r.competency_id===s.id)));let chosen=relevant.slice(0,9);
 const trs=employees.map(e=>`<tr><td><button class="linkBtn" data-action="comp-person" data-id="${e.id}">${esc(e.name)}</button><div class="cNames">${esc(e.job_title)}</div></td>${chosen.map(skill=>{const r=compReq(e).find(x=>x.competency_id===skill.id);if(!r)return '<td class="outside">—</td>';const a=compLatest(e.id,skill.id);const klass=!a?'na':a.level>=r.level?'ok':'gap';return `<td><button class="${klass}" data-action="comp-assess" data-id="${e.id}" data-skill="${skill.id}" title="${esc(skill.name)}: exigido ${r.level}, ${a?'observado '+a.level:'sem avaliação'}">${a?a.level+'/'+r.level:'N/D'}</button></td>`}).join('')}</tr>`).join('');
 return `${panel('Matriz de competências · pessoas × requisitos',`<div class="cHeatWrap"><table class="cHeat"><thead><tr><th>Colaborador / cargo</th>${chosen.map(c=>`<th title="${esc(c.name)}">${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${trs||'<tr><td colspan="12">Sem colaboradores no recorte.</td></tr>'}</tbody></table></div><div class="cLegend"><span>Nível observado ≥ exigido</span><span>Abaixo do requisito</span><span>Não avaliado</span></div><p class="cNotes">Células mostram <strong>nível observado / nível exigido</strong>. Mostrando ${chosen.length} de ${relevant.length} competências aplicáveis. Clique na célula para registrar evidência ou rever avaliação.</p>`,'Avaliações de demonstração são fictícias; use avaliação documentada')}`;
}
function compPersonView(id){const e=compEmployee(id);if(!e)return '<div class="empty">Selecione um colaborador.</div>';const rows=compRows([e]).filter(r=>compUI.category==='all'||r.skill.category===compUI.category);const s=compStats([e],compUI.category);return `<div class="cLead"><div class="person">${person(e.name)}<div><h2>${esc(e.name)}</h2><div class="detail">${esc(e.job_title)} · ${esc(e.department)}</div></div></div>${btn('Abrir ficha completa','employee-detail','light small',`data-id="${e.id}"`)}</div>
 <div class="cKpis">${compKpi('Requisitos do cargo',s.rows.length,'Perfil definido para o cargo')}${compKpi('Avaliados',s.evaluated.length,'Com registro observável')}${compKpi('Lacunas confirmadas',s.below.length,'Somente requisitos avaliados')}${compKpi('Sem avaliação',s.notAssessed,'Nível desconhecido')}</div>
 ${panel('Mapa individual e plano de ação',`<div class="cList">${rows.map(r=>`<div class="cRow"><div><strong>${esc(r.skill.name)}</strong><p>Exigido: ${r.required}/5 · Avaliado: ${r.observed===null?'não registrado':r.observed+'/5'} · Peso do cargo: ${r.weight}/3</p><p>${esc(r.assessment?.evidence||'Sem evidência disponível.')}</p></div><div class="actions">${r.assessment?`<span class="cTag ${r.gap?'warn':'ok'}">${r.gap?'Lacuna '+r.gap:'Atende'}</span>`:'<span class="cTag na">N/D</span>'}${btn('Avaliar','comp-assess','light small',`data-id="${e.id}" data-skill="${r.skill.id}"`)}${r.gap>0?btn('Criar PDI','comp-create-pdi','ghost small',`data-id="${e.id}" data-skill="${r.skill.id}"`)+btn('Vincular curso','comp-course','light small',`data-id="${e.id}" data-skill="${r.skill.id}"`):''}</div></div>`).join('')||'<p class="muted">Este cargo ainda não tem matriz de competências. Cadastre requisitos na aba Perfis.</p>'}</div>`,'Nova avaliação não apaga o histórico')}`;

function compProfiles(){const roles=[...new Set([...state.employees.map(e=>e.job_title),...state.role_competencies.map(r=>r.role)])].sort();return `<div class="cGrid">${roles.map(role=>`<section class="panel cRoleCard"><div class="cLead"><div><h3>${esc(role)}</h3><div class="cNames">${state.employees.filter(e=>e.job_title===role).length} colaboradores</div></div>${btn('＋ Requisito','comp-add-req','ghost small',`data-role="${esc(role)}"`)}</div>${state.role_competencies.filter(r=>r.role===role).map(r=>`<div class="cReqLine"><span><strong>${esc(compSkill(r.competency_id)?.name||'Competência removida')}</strong><span class="cNames" style="display:block">Exigido: ${r.level}/5 · Peso ${r.weight}/3</span></span>${btn('Editar','comp-edit-req','light small',`data-id="${r.id}"`)}${btn('Excluir','comp-delete-req','light small',`data-id="${r.id}"`)}</div>`).join('')||'<div class="cNotes">Nenhuma competência exigida.</div>'}</section>`).join('')}</div>`;}

function compHistory(){return panel('Histórico das avaliações',`<div class="cList">${state.competency_assessments.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||b.id-a.id).slice(0,65).map(a=>{const e=compEmployee(a.employee_id),c=compSkill(a.competency_id);return `<div class="cRow"><div><strong>${esc(e?.name)} · ${esc(c?.name)}</strong><p>${esc(a.date)} · Nível ${a.level}/5 · ${esc(a.method||'Método não informado')} · ${esc(a.reviewer||'Sem avaliador')}</p><p>${esc(a.evidence||'Sem evidência')}</p></div><span class="cTag ${a.demo?'na':''}">${a.demo?'Registro fictício':'Registro manual'}</span></div>`}).join('')}</div><p class="cNotes">Últimas 65 avaliações. Exportação inclui o histórico completo. Cada nova avaliação é um registro próprio, preservando as anteriores.</p>`,'Data, método, responsável e evidência');}
function viewCompetencies(){compInit();const employees=compFilteredEmployees();const tabs=[['overview','Painel gerencial'],['matrix','Matriz'],['person','Mapa individual'],['roles','Perfis de cargo'],['library','Catálogo'],['history','Histórico']];let body=compUI.tab==='overview'?compSummary():compUI.tab==='matrix'?compMatrix():compUI.tab==='person'?`<div class="toolbar"><label class="miniLabel">Colaborador <select class="select" id="compEmployeePicker">${employees.map(e=>`<option value="${e.id}" ${compUI.employeeId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label></div>${compPersonView(employees.some(e=>e.id===compUI.employeeId)?compUI.employeeId:employees[0]?.id)}`:compUI.tab==='roles'?compProfiles():compUI.tab==='library'?compCatalog():compHistory();

function compAssessmentModal(eid,cid){const e=compEmployee(eid),skill=compSkill(cid);if(!e||!skill)throw Error('Colaborador ou competência não encontrados');const req=compReq(e).find(x=>x.competency_id===skill.id),last=compLatest(e.id,skill.id);const methods=['Observação direta','Exercício prático','Entrevista estruturada','Portfólio e entregáveis','Avaliação de gestor','Autoavaliação'];
 const content=`<div class="cNotice"><strong>${esc(e.name)}</strong> · ${esc(skill.name)} · Nível esperado ${req?.level||'não definido'} / 5. ${esc(skill.description)}<br>Último registro: ${last?last.level+'/5 em '+last.date:'não avaliado'}. Esta alteração registra nova evidência, sem apagar o histórico.</div>${pick('level','Nível observado',[1,2,3,4,5].map(n=>[n,`${n} — ${COMP_LEVELS[n]}`]),last?.level||3)}${pick('method','Método da avaliação',methods.map(m=>[m,m]),'Observação direta')}${field('reviewer','Avaliador responsável','Gestor/RH demonstrativo')}${field('date','Data da observação',today(),'date')}${area('evidence','Evidência comportamental verificável')}`;

function evalInit(){
 if(!Array.isArray(state.eval_custom_questions))state.eval_custom_questions=EVAL_CUSTOM_DEFAULT.map((row,i)=>({id:i+1,dim:row[0],text:row[1],reverse:false}));

 if(!state.eval_drafts||typeof state.eval_drafts!=='object')state.eval_drafts={};
 if(!state.eval_initialized){
  const sample=state.candidates.slice(0,16);
  sample.forEach((c,i)=>['style','traits','situations'].forEach((form,j)=>{
   if((i+j)%7===0)return;
   const qs=evalQuestions(form),values=qs.map((q,n)=> q.kind==='sjt'?(i+n*2)%4+1:1+((i*3+n*7+j)%5));
   state.eval_submissions.push(evalMakeSubmission(c,form,qs,values,'simulado',true,'2026-10-'+String(1+(i+j)%10).padStart(2,'0')+'T14:30:00'));
  }));
  state.eval_initialized=true;save();
 }
 if(!evalUI.candidateId)evalUI.candidateId=state.candidates[16]?.id||state.candidates[0]?.id||0;
 if(!evalUI.mapCandidateId){evalUI.mapCandidateId=state.eval_submissions[0]?.candidate_id||state.candidates[0]?.id||0;evalUI.mapForm=state.eval_submissions[0]?.form_id||'style';}

function evalQuestions(form){
 if(form==='style')return EVAL_STYLE.map((x,i)=>({id:'st'+i,kind:'likert',dim:x[0],text:x[1],reverse:!!x[2]}));
 if(form==='traits')return EVAL_TRAITS.map((x,i)=>({id:'tr'+i,kind:'likert',dim:x[0],text:x[1],reverse:!!x[2]}));
 if(form==='situations')return EVAL_SITUATIONS.map((x,i)=>({id:'sj'+i,kind:'sjt',dim:x[0],text:x[1],options:x[2].map((o,j)=>({text:o[0],points:o[1],value:j+1}))}));
 return state.eval_custom_questions.map(q=>({...q,kind:'likert'}));
}

function evalResponse(cid,form){return state.eval_submissions.filter(r=>r.candidate_id===Number(cid)&&r.form_id===form).sort((a,b)=>b.submitted_at.localeCompare(a.submitted_at))[0]||null}
function evalScore(form,qs,values){
 const groups={};qs.forEach((q,i)=>{const v=Number(values[i]);if(!(v>=1&&v<=(q.kind==='sjt'?4:5)))return;
 const n=q.kind==='sjt'?q.options[v-1]?.points:(q.reverse?6-v:v);
 if(!groups[q.dim])groups[q.dim]=[];groups[q.dim].push(n)});
 const scores={};Object.entries(groups).forEach(([dim,x])=>{
  const max=form==='situations'?4:5;
  scores[dim]=Math.round((x.reduce((a,b)=>a+b,0)/x.length-1)/(max-1)*100);
 });return scores;
}

function evalRadar(form,scores){const dims=EVAL_FORMS[form].dimensions;const cx=147,cy=145,R=93,N=dims.length,rad=i=>2*Math.PI*i/N-Math.PI/2,point=(r,i)=>[cx+Math.cos(rad(i))*r,cy+Math.sin(rad(i))*r];
 const poly=(fr)=>dims.map((_,i)=>point(R*fr,i).map(x=>x.toFixed(1)).join(',')).join(' ');
 const layer=[.25,.5,.75,1].map(fr=>`<polygon points="${poly(fr)}" fill="none" stroke="#d9dcee" stroke-width="1"/>`).join('');
 const axes=dims.map((d,i)=>{const [x,y]=point(R,i),[tx,ty]=point(R+30,i);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#d9dcee"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="750" fill="#44506a">${esc(d[0])}</text>`}).join('');

function evalImportResponse(raw){
 if(!raw||raw.format!=='talentflow-evaluation-v1'||!raw.response)throw Error('Arquivo de resposta inválido.');
 const x=raw.response;
 if(!EVAL_FORMS[x.form_id]||!Array.isArray(x.answers))throw Error('Tipo de questionário inválido.');
 const c=state.candidates.find(c=>String(c.email||'').trim().toLowerCase()===String(x.candidate_email||'').trim().toLowerCase());
 if(!c)throw Error('E-mail não coincide com um candidato cadastrado.');
 if(evalResponse(c.id,x.form_id))throw Error('Já existe resposta desse candidato para esse formulário.');
 const trusted=evalQuestions(x.form_id);
 if(!trusted.length||x.answers.length!==trusted.length)throw Error('Versão do formulário incompatível; solicite novo preenchimento.');
 const values=[];
 for(let i=0;i<trusted.length;i++){
  const original=trusted[i],answer=x.answers[i];
  if(!answer||answer.question_id!==original.id||answer.text!==original.text)throw Error('Questão alterada ou incompatível.');
  const value=Number(answer.value),max=original.kind==='sjt'?4:5;
  if(!Number.isInteger(value)||value<1||value>max)throw Error('Resposta fora da escala permitida.');
  values.push(value);
 }
 const verified=evalMakeSubmission(c,x.form_id,trusted,values,'arquivo importado · autoria não verificada',false);
 state.eval_submissions.push(verified);
 audit('Resposta importada (não verificada)','Questionário',c.name+' · '+x.form_id);
 notify('Resposta importada com pontuação recalculada a partir da rubrica local.');
}

 const raw=JSON.stringify(payload).replaceAll('<','\\u003c');
 const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulário · TalentFlow</title><style>

 function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function evalHandleAction(action,el){const id=Number(el.dataset.id),form=el.dataset.form;
 switch(action){
  case 'eval-tab':evalUI.tab=el.dataset.value;return render();
  case 'eval-open-central':return switchPage('assessments');
  case 'eval-open-portal':return switchPage('candidate-forms');
  case 'eval-map-form':evalUI.tab='map';evalUI.mapForm=el.dataset.value;return render();
  case 'eval-open-map':evalUI.mapCandidateId=id;evalUI.mapForm=form;evalUI.tab='map';return switchPage('assessments');
  case 'eval-send-to-portal':evalUI.candidateId=id;evalUI.form=el.dataset.value;evalUI.step=0;return switchPage('candidate-forms');
  case 'eval-cycle-form':{const fs=Object.keys(EVAL_FORMS),idx=fs.indexOf(evalUI.form);evalUI.form=fs[(idx+1)%fs.length];evalUI.step=0;return render();}
  case 'eval-answer':{const q=evalQuestions(evalUI.form)[evalUI.step];if(!q)return;const key=evalDraftKey();if(!state.eval_drafts[key])state.eval_drafts[key]={};state.eval_drafts[key][q.id]=Number(el.dataset.value);save();return render();}
  case 'eval-back':evalUI.step=Math.max(0,evalUI.step-1);return render();
  case 'eval-next':{const q=evalQuestions(evalUI.form)[evalUI.step];if(!evalDraft()[q.id])return notify('Responda antes de avançar.',true);evalUI.step=Math.min(evalQuestions(evalUI.form).length-1,evalUI.step+1);return render()}
  case 'eval-finish':{const qs=evalQuestions(evalUI.form),draft=evalDraft(),c=evalCandidate(evalUI.candidateId);if(qs.length===0||!qs.every(q=>draft[q.id]))return notify('Preencha todas as perguntas.',true);if(!$('#evalConsent')?.checked)return notify('Marque o aceite para salvar a resposta local.',true);if(evalResponse(c.id,evalUI.form))throw Error('O formulário já foi respondido.');const values=qs.map(q=>draft[q.id]);const r=evalMakeSubmission(c,evalUI.form,qs,values);state.eval_submissions.push(r);delete state.eval_drafts[evalDraftKey()];audit('Formulário respondido','Avaliação',c.name+' · '+evalUI.form);notify('Formulário concluído. Índices descritivos disponíveis.');return render()}

const govUI={tab:'overview',severity:'all',actionStatus:'all',candidateId:0};
function govInit(){
 if(!Array.isArray(state.gov_actions))state.gov_actions=[];
 if(!Array.isArray(state.gov_decisions))state.gov_decisions=[];
 if(!Array.isArray(state.gov_feedback))state.gov_feedback=[];

function govCsvCell(v){let x=String(v??'').replace(/\0/g,'');if(/^[\s\uFEFF]*[=+@\-\uFF1D\uFF0B\uFF20\uFF0D]/u.test(x))x="'"+x;return '"'+x.replaceAll('"','""')+'"'}
function govCsv(name,rows){if(!rows.length)return notify('Nenhum registro exportável',true);const keys=Object.keys(rows[0]);const csv='\ufeff'+[keys.map(govCsvCell).join(';'),...rows.map(x=>keys.map(k=>govCsvCell(x[k])).join(';'))].join('\r\n');download(name,csv,'text/csv;charset=utf-8')}
function govIssues(){
 const issues=[],add=(id,level,subject,detail,domain,target='')=>issues.push({id,level,subject,detail,domain,target});
 const mail=new Map();for(const c of state.candidates){const v=String(c.email||'').trim().toLowerCase();if(!v||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))add('email-'+c.id,'high','E-mail ausente ou inválido',c.name+' · Candidato #'+c.id,'Cadastro',c.id);if(v){if(mail.has(v))add('duplicated-'+c.id,'high','E-mail repetido entre candidatos','IDs '+mail.get(v)+' e '+c.id+'. Verificar se é o mesmo profissional.','Cadastro',c.id);else mail.set(v,c.id)}}
 for(const c of state.candidates){if(c.anonymized)continue;const m=String(c.resume_text||'').match(/(\d{1,2})\s+anos?\s+de\s+experi[eê]ncia/i);if(m&&Number(m[1])!==Number(c.experience_years))add('experience-'+c.id,'medium','Experiência divergente do currículo',c.name+': cadastro '+Number(c.experience_years)+' ano(s), currículo menciona '+m[1]+'. Requer conferência de documento.','Cadastro',c.id)}
 const existingApps=new Set(state.applications.map(a=>a.id)),candidateIds=new Set(state.candidates.map(c=>c.id)),jobIds=new Set(state.jobs.map(j=>j.id)),stageIds=new Set(state.job_stages.map(st=>st.id)),employeeIds=new Set(state.employees.map(e=>e.id));
 for(const a of state.applications){if(!candidateIds.has(a.candidate_id)||!jobIds.has(a.job_id)||!stageIds.has(a.stage_id))add('ref-'+a.id,'high','Referência inconsistente','Candidatura '+a.id+' aponta para candidato, vaga ou etapa inexistente.','Integridade',a.id);if(a.status==='hired'&&!a.hired_at)add('hiredate-'+a.id,'medium','Contratação sem data verificada','Candidatura '+a.id+' possui status contratado, mas não o evento hired_at.','Medição',a.id)}
 const candidateInterview=new Set(state.scorecards.map(s=>s.application_id));for(const iv of state.interviews){if(!existingApps.has(iv.application_id))add('interview-ref-'+iv.id,'high','Entrevista sem candidatura','Entrevista '+iv.id+' sem vínculo válido.','Integridade',iv.id);if(['completed','realized','done'].includes(String(iv.status).toLowerCase())&&!candidateInterview.has(iv.application_id))add('interview-'+iv.id,'medium','Entrevista concluída sem scorecard','Entrevista #'+iv.id+' necessita evidências de avaliação.','Seleção',iv.application_id)}
 const current=today();for(const t of state.onboarding_items){if(!employeeIds.has(t.employee_id))add('on-ref-'+t.id,'high','Tarefa sem colaborador','Integração '+t.id+' sem colaborador válido.','Integridade',t.id);if(t.due_date&&t.due_date<current&&!t.completed_at)add('on-overdue-'+t.id,'medium','Integração atrasada','Tarefa '+t.title+' · '+(employeeFor(t)?.name||'Sem nome')+' · '+date(t.due_date),'Integração',t.employee_id)}
 for(const p of state.development_plans){if(p.due_date&&p.due_date<current&&p.status!=='completed')add('pdi-overdue-'+p.id,'medium','PDI após o prazo',p.title+' · '+(employeeFor(p)?.name||''),'Desenvolvimento',p.employee_id);if(p.actions?.some(a=>a.done&&!String(a.evidence||'').trim()))add('pdi-proof-'+p.id,'medium','Ação concluída sem evidência',p.title+' · ações concluídas precisam de registro observável.','Desenvolvimento',p.employee_id)}
 for(const g of state.performance_goals){if(!(Number(g.target_value)>0))add('goal-'+g.id,'high','Meta sem denominador válido',g.title,'Desempenho',g.employee_id)}
 const demoAssess=(state.competency_assessments||[]).filter(a=>a.demo).length;if(demoAssess)add('competencies-demo','medium','Avaliações de competências simuladas',demoAssess+' avaliações de exemplo não devem embasar decisões reais.','Evidência');
 const simulatedSub=(state.eval_submissions||[]).filter(r=>r.demo).length;if(simulatedSub)add('questionnaires-demo','medium','Questionários simulados',simulatedSub+' envios sintéticos estão no painel; não são avaliações reais.','Evidência');
 if(state.candidates.some(c=>!c.privacy_record))add('privacy-basis','medium','Base legal/finalidade não documentadas','O HTML não possui rastreabilidade institucional de bases legais por candidato. Não conclua que existe consentimento.','Privacidade');
 if(state.audit.length===0)add('no-audit','low','Sem movimentações auditadas nesta cópia','Histórico local não possui autenticação nem integridade garantida.','Governança');
 return issues;
}
const govPill=l=>`<span class="gPill ${l==='high'?'high':l==='medium'?'medium':'low'}">${({high:'Crítico',medium:'Atenção',low:'Informação'})[l]||esc(l)}</span>`;

function govStats(){const issues=govIssues(),critical=issues.filter(x=>x.level==='high').length,plans=state.development_plans,goals=state.performance_goals;
 const pdiActions=plans.flatMap(p=>p.actions||[]),proof=pdiActions.filter(a=>a.done&&String(a.evidence||'').trim()).length,complete=pdiActions.filter(a=>a.done).length;

 const assess=(state.competency_assessments||[]),realAssess=assess.filter(a=>!a.demo).length;
 return {issues,critical,complete,proof,reviewed,interviewDone,realAssess,totalAssess:assess.length,unfinishedActions:state.gov_actions.filter(a=>a.status!=='done').length};}
function govToolbar(){const items=[['overview','Centro de decisão'],['quality','Qualidade dos dados'],['decisions','Pareceres estruturados'],['actions','Planos de ação'],['feedback','Feedback 1:1'],['privacy','Privacidade e backup']];return `<div class="gTabs" role="tablist" aria-label="Módulos de governança">${items.map(([k,l])=>`<button type="button" role="tab" aria-selected="${govUI.tab===k}" data-action="gov-tab" data-value="${k}" class="${govUI.tab===k?'active':''}">${l}</button>`).join('')}</div>`}

recard → parecer humano → decisão documentada. Nenhum índice comportamental muda candidaturas automaticamente.</p><div class="gRow"><b>Entrevistas marcadas como concluídas</b><b>${x.interviewDone}</b></div><div class="gRow"><b>Pareceres com revisão humana validada</b><b>${x.reviewed}</b></div>${btn('Criar parecer','gov-new-decision','light')}</div></div></div>`}

function govExtractSubject(id){const c=state.candidates.find(x=>x.id===id);if(!c)throw Error('Candidato não encontrado');const apps=state.applications.filter(a=>a.candidate_id===id),ids=new Set(apps.map(x=>x.id));return {format:'talentflow-data-subject-export-v1',exported_at:new Date().toISOString(),warning:'Dados de demonstração; identidade do solicitante não autenticada',candidate:c,applications:apps,interviews:state.interviews.filter(i=>ids.has(i.application_id)),scorecards:state.scorecards.filter(i=>ids.has(i.application_id)),offers:state.offers.filter(i=>ids.has(i.application_id)),communications:state.communications.filter(i=>ids.has(i.application_id)),assessments:(state.eval_submissions||[]).filter(r=>r.candidate_id===id),decisions:state.gov_decisions.filter(r=>ids.has(r.application_id))}}
function govAnonymize(id){const c=state.candidates.find(x=>x.id===id);if(!c)throw Error('Candidato inexistente');if(c.anonymized)return notify('Este registro já está anonimizado');const oldName=c.name;c.name='Candidato anonimizado #'+id;c.email='anonimizado-'+id+'@example.invalid';c.phone='';c.location='';c.skills='';c.education='';c.title='';c.resume_text='';c.anonymized=true;c.anonymized_at=new Date().toISOString();const ids=new Set(state.applications.filter(a=>a.candidate_id===id).map(a=>a.id));state.eval_submissions=state.eval_submissions.filter(r=>r.candidate_id!==id);for(const k of Object.keys(state.eval_drafts||{}))if(k.startsWith(id+':')||k.startsWith(id+'|'))delete state.eval_drafts[k];state.communications=state.communications.filter(x=>!ids.has(x.application_id));state.gov_decisions=state.gov_decisions.filter(x=>!ids.has(x.application_id));for(const sc of state.scorecards)if(ids.has(sc.application_id))sc.comment='[Removido na anonimização demonstrativa]';for(const row of state.audit)for(const k of ['detail'])if(typeof row[k]==='string')row[k]=row[k].replaceAll(oldName,'[pessoa anonimizada]');state.gov_privacy_events.push({candidate_id:id,action:'local_anonymization',date:new Date().toISOString()});audit('Mascaramento parcial local','Privacidade','Candidato #'+id+' — dados identificadores locais substituídos');notify(oldName+' · identificadores locais mascarados')}
function govHandleAction(action,el){govInit();const id=Number(el.dataset.id||0);switch(action){
 case 'gov-open':govUI.tab='overview';return switchPage('governance');case 'gov-tab':govUI.tab=el.dataset.value;return render();case 'gov-to-pdi':return switchPage('pdi');
 case 'gov-export-issues':return govCsv('TalentFlow-qualidade-'+today()+'.csv',govIssues().map(x=>({gravidade:x.level,tipo:x.subject,descricao:x.detail,dominio:x.domain,identificador:x.id})));
 case 'gov-plan-issue':return govNewAction(govIssues().find(x=>x.id===el.dataset.id));case 'gov-new-action':return govNewAction();
 case 'gov-close-action':{const a=state.gov_actions.find(x=>x.id===id);if(!a)return;return modal('Concluir plano de ação',`<div class="gNote">${esc(a.title)} · responsável: ${esc(a.owner)}</div>${area('evidence','Evidência da correção / verificação')}`,d=>{if(d.evidence.trim().length<20)throw Error('Informe a evidência de conclusão com pelo menos 20 caracteres');a.close_evidence=d.evidence.trim();a.closed_at=new Date().toISOString();a.status='done';audit('Plano de ação concluído','Governança',a.title);notify('Conclusão registrada')})}

 case 'gov-new-decision':return govNewDecision();
 case 'gov-detail-decision':{const d=state.gov_decisions.find(x=>x.id===id);if(!d)return;return modal('Parecer e trilha de decisão',`<div class="gNote">${esc(d.candidate_name)} · ${esc(d.job_title)}</div><p><b>Critério:</b> ${esc(d.criterion)}</p><p><b>Evidência:</b> ${esc(d.evidence)}</p><p><b>Justificativa:</b> ${esc(d.rationale)}</p><p><b>Revisor:</b> ${esc(d.reviewer)}</p><p><b>Situação:</b> ${esc(d.status)}</p><div class="gWarning">Nenhum parecer, incluindo os validados, altera automaticamente o status de contratação.</div>`,null,true)}
 case 'gov-validate-decision':{const d=state.gov_decisions.find(x=>x.id===id);if(!d)return;const found=state.scorecards.some(s=>s.application_id===d.application_id);if(!found)return notify('É necessário registrar um scorecard estruturado para esta candidatura antes de validar.',true);return modal('Revisão humana final',`<div class="gNote">${esc(d.candidate_name)} · ${esc(d.criterion)}</div>${field('validator','Nome do revisor independente')}${area('note','Razão da validação e limitações')}`,v=>{if(v.validator.trim().length<3||v.note.trim().length<20)throw Error('Informe responsável e justificativa detalhada');d.status='validated';d.validated_by=v.validator.trim();d.review_note=v.note.trim();d.validated_at=new Date().toISOString();audit('Parecer validado por humano','Decisão',d.candidate_name);notify('Parecer validado sem movimentação automática de candidato')},true)}
 case 'gov-new-feedback':return govNewFeedback();case 'gov-followup':{const f=state.gov_feedback.find(x=>x.id===id);if(!f)return;return modal('Acompanhamento do feedback',`${area('evidence','O que mudou? Inclua exemplos observáveis')}`,d=>{if(d.evidence.trim().length<20)throw Error('Descreva evidência com pelo menos 20 caracteres');f.done=true;f.followup_evidence=d.evidence.trim();f.closed_at=new Date().toISOString();audit('Follow-up registrado','Feedback','Registro '+id)})}
 case 'gov-subject-export':{const id=Number($('#govCandidatePicker')?.value||govUI.candidateId);return download('TalentFlow-pessoa-'+id+'.json',JSON.stringify(govExtractSubject(id),null,2),'application/json')}
 case 'gov-anonymize':{const id=Number($('#govCandidatePicker')?.value||govUI.candidateId),c=state.candidates.find(x=>x.id===id);if(!c)return;if(!confirm('Mascarar identificadores e excluir avaliações/comunicações locais de '+c.name+'? Esta ação não desfaz cópias/exports nem constitui exclusão garantida em servidores.'))return;govAnonymize(id);return render()}
 case 'gov-backup':return download('TalentFlow-local-backup-'+today()+'.json',JSON.stringify({format:'talentflow-local-backup-v1',saved_at:new Date().toISOString(),data:state},null,2),'application/json');
 case 'gov-snapshot':{const x=govStats();state.gov_snapshots.push({date:new Date().toISOString(),issues:x.issues.length,critical:x.critical,actions:x.unfinishedActions});audit('Snapshot de qualidade','Governança','Achados '+x.issues.length+'; críticos '+x.critical);return notify('Snapshot local registrado. Não equivale a acompanhamento temporal automatizado.')}
 }}

 /* TalentFlow People 1.1 — funções próprias inspiradas em fluxos documentados do Frappe HR.

const peopleUI={cycle:0,employee:0,role:'all',tab:'overview',mobEmp:0,mobRole:'all',opsTab:'overview',learnTab:'overview',intelTab:'quality'};
const REVIEW_CRITERIA=[{id:'delivery',name:'Entregas e resultados',weight:35},{id:'collaboration',name:'Colaboração',weight:25},{id:'quality',name:'Qualidade e responsabilidade',weight:25},{id:'growth',name:'Aprendizagem aplicada',weight:15}];
function peopleInit(){
 const fields=['people_cycles','people_reviews','people_calibrations','people_mobility_interests','people_opportunities','people_leave_steps','people_learning_evidence','people_kpi_snapshots','people_consents'];
 for(const key of fields)if(!Array.isArray(state[key]))state[key]=[];
 if(!state.people_cycles.length)state.people_cycles.push({id:1,name:'Ciclo de desenvolvimento · 2º semestre de 2026',start:'2026-07-01',end:'2026-12-31',status:'open',criteria:clone(REVIEW_CRITERIA),demo:true});
 if(!state.people_opportunities.length)state.people_opportunities=[
 {id:1,title:'Analista de RH',department:'Pessoas',role:'Analista de RH',status:'open',demo:true},
 {id:2,title:'Engenheiro de Software',department:'Tecnologia',role:'Engenheiro de Software',status:'open',demo:true},
 {id:3,title:'Product Designer',department:'Produto',role:'Product Designer',status:'open',demo:true}
 ];
 if(!peopleUI.cycle)peopleUI.cycle=state.people_cycles[0]?.id||0;
 if(!peopleUI.employee)peopleUI.employee=state.employees[0]?.id||0;
 if(!peopleUI.mobEmp)peopleUI.mobEmp=state.employees[0]?.id||0;
 if(peopleUI.mobRole==='all')peopleUI.mobRole=state.people_opportunities[0]?.role||'all';
}
const peopleDate=x=>x?date(x):'Não informado';
const peopleHtmlEmpty=t=>`<div class="gEmpty">${esc(t)}</div>`;
function peopleTabs(options,selected,attribute){return `<div class="gTabs">${options.map(([k,l])=>`<button class="${selected===k?'active':''}" data-people-tab="${attribute}" data-value="${esc(k)}">${esc(l)}</button>`).join('')}</div>`}
function peopleStats(){peopleInit();const reviews=state.people_reviews;const finished=reviews.filter(r=>r.status==='submitted');const managerIds=new Set(finished.filter(r=>r.role==='manager'&&r.cycle_id===peopleUI.cycle).map(r=>r.employee_id));const activeEmployees=state.employees.filter(e=>e.status==='active');const allCompetencyRows=compRows(activeEmployees),covered=allCompetencyRows.filter(r=>!!r.assessment).length;
 const learning=state.people_learning_evidence;const pairs=state.learning_enrollments.filter(e=>learning.some(x=>x.enrollment_id===e.id&&x.phase==='before')&&learning.some(x=>x.enrollment_id===e.id&&x.phase==='after')).length;
 return {finished:finished.length,managerCoverage:activeEmployees.length?Math.round(100*managerIds.size/activeEmployees.length):null,covered,compTotal:allCompetencyRows.length,pairs};}
function peopleCyclePicker(){return `<select class="select" data-people-select="cycle">${state.people_cycles.map(c=>`<option value="${c.id}" ${peopleUI.cycle===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}
function peopleEmployeePicker(field='employee'){return `<select class="select" data-people-select="${field}">${state.employees.filter(e=>e.status==='active').map(e=>`<option value="${e.id}" ${peopleUI[field]===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`}
function peopleScores(review){const cycle=state.people_cycles.find(c=>c.id===review.cycle_id),crit=cycle?.criteria||REVIEW_CRITERIA;const den=crit.reduce((n,c)=>n+c.weight,0);return den?crit.reduce((n,c)=>n+c.weight*Number(review.scores[c.id]||0),0)/den:null}
function peopleReviewSummary(employeeId,cycleId){const rev=state.people_reviews.filter(x=>x.employee_id===employeeId&&x.cycle_id===cycleId&&x.status==='submitted');const byRole={self:rev.filter(x=>x.role==='self'),manager:rev.filter(x=>x.role==='manager'),peer:rev.filter(x=>x.role==='peer')};return {rev,byRole,score:rev.length?rev.reduce((v,r)=>v+peopleScores(r),0)/rev.length:null}}
function viewCycles(){peopleInit();const cycle=state.people_cycles.find(c=>c.id===peopleUI.cycle)||state.people_cycles[0],rev=state.people_reviews.filter(x=>x.cycle_id===cycle?.id),all=state.employees.filter(e=>e.status==='active'),done=all.filter(e=>rev.some(r=>r.employee_id===e.id&&r.role==='manager'&&r.status==='submitted')).length;
 let body='';
 if(peopleUI.tab==='overview'){
 body=`<div class="psplit"><section class="panel ppadded"><h3>Critérios do ciclo</h3><p class="muted">Rubrica interna, pesos somam 100%. Avaliações requerem evidências observáveis.</p>${cycle.criteria.map(c=>`<div class="prow"><div><strong>${esc(c.name)}</strong><p class="muted">Peso definido no modelo do ciclo</p></div><span class="pill">${c.weight}%</span></div>`).join('')}</section><section class="panel ppadded"><h3>Cobertura e processo</h3><p>Gestores enviaram avaliações para <strong>${done} de ${all.length}</strong> colaboradores ativos.</p>${progress(all.length?done/all.length*100:0)}<div class="pnotice">Revisão humana, autoavaliação e parecer de pares são registros separados; não se calculam aptidão ou promoção automática.</div>${btn('Registrar avaliação','people-review-new','')}${btn('Criar ciclo','people-cycle-new','light')}</section></div>`;
 }else if(peopleUI.tab==='reviews'){
 body=`<div class="panel ppadded">${btn('＋ Registrar avaliação','people-review-new','')}${rev.length?`<div class="gTableScroll"><table class="gTable"><thead><tr><th>Colaborador</th><th>Perspectiva</th><th>Avaliador</th><th>Nota interna</th><th>Data</th><th></th></tr></thead><tbody>${rev.slice().reverse().map(r=>`<tr><td>${esc(compEmployee(r.employee_id)?.name||'—')}</td><td>${esc(({manager:'Gestor',peer:'Par',self:'Autoavaliação'})[r.role]||r.role)}</td><td>${esc(r.reviewer)}</td><td>${peopleScores(r)?.toFixed(2)||'—'} / 5</td><td>${peopleDate(r.created_at)}</td><td>${btn('Evidências','people-review-detail','light small',`data-id="${r.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:peopleHtmlEmpty('Nenhuma avaliação registrada neste ciclo.')}</div>`;
 }else if(peopleUI.tab==='calibration'){
 const byEmployee=all.map(e=>({e,s:peopleReviewSummary(e.id,cycle.id)})).filter(x=>x.s.rev.length);
 body=`<section class="panel ppadded"><div class="pnotice">Calibração não altera a avaliação original. Exige justificativa documentada e mantém os pareceres individuais.</div>${byEmployee.map(x=>{const cal=state.people_calibrations.filter(y=>y.employee_id===x.e.id&&y.cycle_id===cycle.id).slice(-1)[0];return `<div class="prow"><div><strong>${esc(x.e.name)}</strong><p class="muted">${x.s.rev.length} avaliações · média descritiva ${x.s.score?.toFixed(2)||'N/D'}/5</p><p class="muted">${cal?'Parecer: '+esc(cal.summary):'Sem parecer de calibração'}</p></div>${btn('Calibrar','people-calibrate','light small',`data-id="${x.e.id}"`)}</div>`}).join('')||peopleHtmlEmpty('Realize avaliações antes da calibração.')}</section>`;
 }
 return head('Ciclos de desempenho','Metas e feedback estruturado; inspirado nos fluxos de Appraisal Cycle, Templates e Feedback do Frappe HR.',btn('＋ Novo ciclo','people-cycle-new',''))+`<div class="toolbar">${peopleCyclePicker()}${badge(`${cycle.status==='open'?'Aberto':'Encerrado'} · ${cycle.start} a ${cycle.end}`,'gray')}</div>`+peopleTabs([['overview','Visão do ciclo'],['reviews','Avaliações 90°/180°/360°'],['calibration','Calibração']],peopleUI.tab,'tab')+body;
}
function peopleNewCycle(){modal('Novo ciclo de desempenho',`${field('name','Nome do ciclo')}${field('start','Início',today(),'date')}${field('end','Término',today(),'date')}${area('notes','Finalidade e instruções do ciclo')}`,d=>{if(d.end<=d.start)throw Error('O término deve ser posterior ao início.');if(d.name.trim().length<5)throw Error('Nome insuficiente');const id=idFor('people_cycles');state.people_cycles.push({id,...d,status:'open',criteria:clone(REVIEW_CRITERIA),created_at:new Date().toISOString()});peopleUI.cycle=id;peopleUI.tab='overview';audit('Ciclo criado','Desempenho',d.name);notify('Ciclo criado')})}
function peopleNewReview(){const cycle=state.people_cycles.find(c=>c.id===peopleUI.cycle);if(!cycle||cycle.status!=='open')throw Error('Escolha um ciclo aberto');const f=cycle.criteria.map(c=>field('score_'+c.id,`${c.name} · peso ${c.weight}% (1–5)`,3,'number')).join('');modal('Avaliação estruturada',`${employeePick(peopleUI.employee)}${pick('role','Perspectiva',[['manager','Gestor (90°)'],['self','Autoavaliação'],['peer','Par / equipe (360°)']])}${field('reviewer','Nome do avaliador','Avaliador demonstrativo')}${f}${area('evidence','Evidências observáveis (mínimo 30 caracteres)')}${area('next_steps','Próximas ações / devolutiva')}`,d=>{
 const eid=Number(d.employee_id),weights=cycle.criteria,scores={};for(const c of weights){const v=Number(d['score_'+c.id]);if(!Number.isInteger(v)||v<1||v>5)throw Error('Notas devem ser inteiros de 1 a 5');scores[c.id]=v;}
 if((d.evidence||'').trim().length<30)throw Error('Documente evidências específicas (mínimo 30 caracteres).');if((d.reviewer||'').trim().length<3)throw Error('Identifique o avaliador');const id=idFor('people_reviews');state.people_reviews.push({id,employee_id:eid,cycle_id:cycle.id,role:d.role,reviewer:d.reviewer,scores,evidence:d.evidence,next_steps:d.next_steps,status:'submitted',created_at:new Date().toISOString()});audit('Avaliação estruturada registrada','Desempenho',`${compEmployee(eid)?.name} · ${d.role}`);peopleUI.tab='reviews';notify('Avaliação e evidências registradas')},true)}
function peopleReviewDetail(id){const r=state.people_reviews.find(x=>x.id===id);if(!r)return;const crit=state.people_cycles.find(x=>x.id===r.cycle_id)?.criteria||REVIEW_CRITERIA;return modal('Evidências da avaliação',`<p><strong>${esc(compEmployee(r.employee_id)?.name)} · ${esc(r.reviewer)}</strong></p>${crit.map(c=>`<div class="prow"><span>${esc(c.name)}</span><strong>${r.scores[c.id]}/5</strong></div>`).join('')}<div class="pnotice"><strong>Evidências</strong><p>${esc(r.evidence)}</p><strong>Ações sugeridas</strong><p>${esc(r.next_steps)}</p></div>`,null,true)}
function peopleCalibrate(id){const e=compEmployee(id);if(!e)return;const original=peopleReviewSummary(id,peopleUI.cycle);modal('Parecer de calibração · '+e.name,`<p class="muted">${original.rev.length} avaliações independentes preservadas. Síntese não autoriza promoção automática.</p>${area('summary','Justificativa da revisão (mínimo 30 caracteres)')}${pick('decision','Encaminhamento',[['development','Plano de desenvolvimento'],['follow_up','Acompanhamento'],['discussion','Reunião de calibração']])}${field('reviewer','Responsável pela calibração')}`,d=>{if(d.summary.trim().length<30||d.reviewer.trim().length<3)throw Error('Registre justificativa detalhada e responsável');state.people_calibrations.push({...d,id:idFor('people_calibrations'),employee_id:id,cycle_id:peopleUI.cycle,original_review_ids:original.rev.map(r=>r.id),created_at:new Date().toISOString()});audit('Parecer de calibração','Desempenho',e.name);notify('Parecer registrado sem alterar avaliações')},true)}
function peopleMobilityData(employeeId,role){const e=compEmployee(employeeId);const req=state.role_competencies.filter(r=>r.role===role);const rows=req.map(r=>{const a=compLatest(employeeId,r.competency_id);return {skill:compSkill(r.competency_id),required:r.level,observed:a?.level??null,source:a?.method||'',assessed:!!a,gap:a?Math.max(0,r.level-a.level):null}});return {e,rows,assessed:rows.filter(x=>x.assessed).length,missing:rows.filter(x=>!x.assessed).length,gaps:rows.filter(x=>x.gap>0)}}

 `<div class="psplit"><section class="panel ppadded"><h3>Mapa de mobilidade</h3><div class="toolbar" style="margin-top:12px">${peopleEmployeePicker('mobEmp')}<select class="select" data-people-select="mobRole">${opps.map(o=>`<option value="${esc(o.role)}" ${peopleUI.mobRole===o.role?'selected':''}>${esc(o.title)} · ${esc(o.department)}</option>`).join('')}</select></div><div class="pnotice">Cobertura documentada: ${data.assessed}/${data.rows.length}. Não avaliado ≠ incapaz. Não gera ranking nem decisão automática.</div>${data.rows.map(r=>`<div class="prow"><div><strong>${esc(r.skill?.name||'Competência')}</strong><p class="muted">Exigido ${r.required} · ${r.assessed?'observado '+r.observed:'sem avaliação'} ${r.gap?' · lacuna '+r.gap:''}</p></div>${badge(!r.assessed?'Não avaliado':r.gap?'A desenvolver':'Documentado',!r.assessed?'gray':r.gap?'amber':'green')}</div>`).join('')||peopleHtmlEmpty('Sem perfil de competências configurado para esta oportunidade.')}<div class="actions" style="margin-top:14px">${btn('Registrar interesse','people-interest','')}${btn('Criar PDI para lacuna','people-mob-pdi','light')}</div>${interest?`<p class="pnotice">Interesse registrado em ${peopleDate(interest.date)} · ${esc(interest.note)}</p>`:''}</section><section class="panel ppadded"><h3>Oportunidades internas</h3>${opps.map(o=>`<div class="prow"><div><strong>${esc(o.title)}</strong><p class="muted">${esc(o.department)} · perfil: ${esc(o.role)}</p></div>${badge('Aberta','green')}</div>`).join('')}<div class="pnotice">Modelo de mobilidade voluntária. Informações não representam oferta de vaga real ou proposta salarial.</div></section></div>`;}

function peopleLearningRows(){const all=state.people_learning_evidence;return state.learning_enrollments.map(e=>{const phases=all.filter(x=>x.enrollment_id===e.id);const before=phases.filter(x=>x.phase==='before').slice(-1)[0],after=phases.filter(x=>x.phase==='after').slice(-1)[0];return {enrollment:e,employee:compEmployee(e.employee_id),course:state.learning_courses.find(x=>x.id===e.course_id),before,after,delta:before&&after?after.score-before.score:null}})}

 `<section class="panel ppadded"><h3>Rastreamento por colaborador</h3><div class="gTableScroll"><table class="gTable"><thead><tr><th>Colaborador</th><th>Curso</th><th>Antes</th><th>Depois</th><th>Diferença</th><th>Evidência</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.employee?.name||'—')}</td><td>${esc(x.course?.title||'—')}</td><td>${x.before?x.before.score+' / 100':'N/D'}</td><td>${x.after?x.after.score+' / 100':'N/D'}</td><td>${x.delta!==null?(x.delta>=0?'+':'')+x.delta+' p.p.':'N/D'}</td><td>${x.after?esc(x.after.evidence.slice(0,90)):x.before?esc(x.before.evidence.slice(0,90)):'Sem medida'}</td></tr>`).join('')}</tbody></table></div><p class="pnotice">Uma diferença antes/depois é descritiva. Não demonstra causalidade do curso; critérios, escalas e avaliações devem ser equivalentes.</p></section>`;}
function peopleNewLearning(){if(!state.learning_enrollments.length)throw Error('Não há matrículas');const options=state.learning_enrollments.map(en=>[en.id,`${compEmployee(en.employee_id)?.name||''} · ${state.learning_courses.find(c=>c.id===en.course_id)?.title||''}`]);modal('Evidência de aprendizagem',`${pick('enrollment_id','Matrícula',options)}${pick('phase','Momento',[['before','Antes do curso'],['after','Depois do curso']])}${field('score','Avaliação observável (0–100)',50,'number')}${area('evidence','Evidência específica e método (mínimo 25 caracteres)')}${field('reviewer','Responsável','Avaliador demonstrativo')}`,d=>{const n=Number(d.score),eid=Number(d.enrollment_id);if(!Number.isFinite(n)||n<0||n>100)throw Error('Pontuação deve ser entre 0 e 100');if(d.evidence.trim().length<25)throw Error('Registre método e evidência concreta');if(!state.learning_enrollments.some(x=>x.id===eid))throw Error('Matrícula inválida');state.people_learning_evidence.push({id:idFor('people_learning_evidence'),enrollment_id:eid,phase:d.phase,score:n,evidence:d.evidence,reviewer:d.reviewer,created_at:new Date().toISOString()});audit('Evidência de aprendizagem','Treinamento',`Matrícula ${eid} · ${d.phase}`);notify('Medição registrada sem inferência causal')},true)}
function peopleOpsStats(){const pending=state.leave_requests.filter(x=>x.status==='pending'||x.status==='manager_approved'),completed=state.leave_requests.filter(x=>x.status==='approved'),overdue=state.onboarding_items.filter(x=>!x.completed_at&&x.due_date<today());return {pending,completed,overdue}}

 `<section class="panel ppadded"><h3>Fluxo de férias / ausências</h3><p class="muted">Solicitação → parecer gestor → decisão RH. Nenhuma etapa concede direito trabalhista nem efetua folha.</p><div class="gTableScroll"><table class="gTable"><thead><tr><th>Colaborador</th><th>Tipo</th><th>Período</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${state.leave_requests.map(l=>`<tr><td>${esc(employeeFor(l)?.name||'—')}</td><td>${esc(l.kind)}</td><td>${peopleDate(l.starts_on)} → ${peopleDate(l.ends_on)}</td><td>${badge(l.status==='pending'?'Aguardando gestor':l.status==='manager_approved'?'Aguardando RH':l.status==='approved'?'Aprovada':'Recusada',l.status==='approved'?'green':'amber')}</td><td>${l.status==='pending'?btn('Parecer gestor','people-leave-manager','light small',`data-id="${l.id}"`):l.status==='manager_approved'?btn('Decisão RH','people-leave-hr','light small',`data-id="${l.id}"`):'—'}</td></tr>`).join('')}</tbody></table></div></section><section class="panel ppadded" style="margin-top:13px"><h3>Histórico de aprovações</h3>${state.people_leave_steps.slice(-10).reverse().map(x=>`<div class="prow"><div><strong>${esc(x.step)} · solicitação ${x.leave_id}</strong><p class="muted">${esc(x.actor)} · ${peopleDate(x.date)} · ${esc(x.reason)}</p></div>${badge(x.result,x.result==='approved'?'green':'amber')}</div>`).join('')||peopleHtmlEmpty('Nenhuma etapa registrada.')}</section>`;}
function peopleLeaveStep(id,phase){const l=state.leave_requests.find(x=>x.id===id);if(!l)throw Error('Solicitação não encontrada');const status=phase==='manager'?'pending':'manager_approved';if(l.status!==status)throw Error('Etapa de aprovação fora de ordem');modal('Aprovação · '+(phase==='manager'?'Gestor':'RH'),`${field('actor','Responsável pela análise')}${pick('result','Decisão',[['approved','Aprovar'],['rejected','Recusar']])}${area('reason','Justificativa (mínimo 15 caracteres)')}`,d=>{if(d.actor.trim().length<3||d.reason.trim().length<15)throw Error('Informe responsável e justificativa');const old=l.status;l.status=d.result==='rejected'?'rejected':(phase==='manager'?'manager_approved':'approved');state.people_leave_steps.push({id:idFor('people_leave_steps'),leave_id:id,step:phase==='manager'?'Parecer gestor':'Aprovação RH',actor:d.actor,result:d.result,reason:d.reason,date:new Date().toISOString(),previous_status:old,next_status:l.status});audit('Etapa de aprovação registrada','Ausência',`Solicitação ${id}: ${old} → ${l.status}`);notify('Etapa e justificativa registradas')},true)}

function modal(title,body,onSubmit=null,wide=false){$('#modalRoot').innerHTML=`<div class="modalShade"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalHeader"><h2>${esc(title)}</h2><button class="btn light small" data-action="modal-close">✕ Fechar</button></div><form id="modalForm"><div class="modalContent">${body}</div><div class="modalFooter">${btn('Cancelar','modal-close','light')}${onSubmit?'<button class="btn" type="submit">Salvar alterações</button>':''}</div></form></section></div>`;window.modalSubmit=onSubmit;$('#modalForm').addEventListener('submit',e=>{e.preventDefault();if(!window.modalSubmit)return;const data=Object.fromEntries(new FormData(e.target));try{window.modalSubmit(data);$('#modalRoot').innerHTML='';render()}catch(err){notify(err.message,true)}})}

function appDetail(appId,candidateId){const a=state.applications.find(x=>x.id===Number(appId));const c=state.candidates.find(x=>x.id===(a?.candidate_id||Number(candidateId)));if(!c)return notify('Candidato não encontrado',true);const stages=state.job_stages.filter(s=>s.job_id===a?.job_id).sort((a,b)=>a.order-b.order);const it=state.interviews.filter(i=>i.application_id===a?.id);const sc=state.scorecards.filter(s=>s.application_id===a?.id);const of=state.offers.filter(o=>o.application_id===a?.id);modal(c.name,`<div class="person">${person(c.name)}<div><strong>${esc(c.title)} · ${esc(c.location)}</strong><p class="muted" style="margin:4px 0">${esc(c.email)} · ${esc(c.source)}</p></div></div><div class="tabs">${badge((a?.fit||0)+'% fit demonstrativo',a?.fit>=75?'green':'amber')}${badge(c.experience_years+' anos de experiência')}${badge((stages.find(s=>s.id===a?.stage_id)||{}).name||'Banco de talentos')}</div><div class="grid2">${panel('Competências e currículo',`<div class="tags">${(c.skills||'').split(',').map(s=>`<span class="tag">${esc(s.trim())}</span>`).join('')}</div><p>${esc(c.education)}</p><p class="muted">${esc((c.resume_text||'Nenhum currículo textual').slice(0,400))}</p>`)}${panel('Processo e histórico',`${a?pick('stage_id','Etapa da candidatura',stages.map(s=>[s.id,s.name]),a.stage_id):'<p>Sem candidatura associada.</p>'}<div class="help">${it.length} entrevistas · ${sc.length} avaliações · ${of.length} propostas</div>${of.map(o=>`<div class="listItem"><div><strong>Proposta R$ ${esc(o.salary)}</strong><div class="detail">Status: ${esc(o.status)}</div></div>${o.status==='sent'?btn('Simular aceite','offer-accept','ghost small',`data-id="${o.id}"`):o.status==='accepted'&&!state.employees.some(e=>e.application_id===a.id)?btn('Registrar contratação','offer-hire','ghost small',`data-id="${o.id}"`):badge(o.status==='hired'?'Contratado':o.status,'green')}</div>`).join('')}<hr class="hr"/><div class="actions"><button type="button" class="btn ghost small" data-action="eval-send-to-portal" data-id="${c.id}" data-value="style">Questionários</button><button type="button" class="btn ghost small" data-action="interview-new" data-id="${a?.id||0}">Agendar entrevista</button><button type="button" class="btn light small" data-action="score-new" data-id="${a?.id||0}">Scorecard</button><button type="button" class="btn light small" data-action="message-new" data-id="${a?.id||0}">Mensagem</button><button type="button" class="btn light small" data-action="offer-new" data-id="${a?.id||0}">Proposta</button></div>`)} </div><div class="alert" style="margin-top:16px">Triagem simulada: avaliação humana é obrigatória. Nenhuma decisão irreversível é tomada pela IA.</div>`,a?d=>{const stage=Number(d.stage_id);if(a.stage_id!==stage)moveCandidate(a.id,stage)}:null,true)}
function moveCandidate(appId,newStage){const a=state.applications.find(x=>x.id===Number(appId));const s=state.job_stages.find(x=>x.id===Number(newStage));if(!a||!s||a.job_id!==s.job_id)throw Error('Etapa inválida para esta vaga');const prev=stageFor(a)?.name||'Não definida';if(s.kind==='hired'||/contratad/i.test(s.name)){const accepted=state.offers.some(o=>o.application_id===a.id&&(o.status==='accepted'||o.status==='hired'));if(!accepted)throw Error('Contratação exige proposta aceita; conclua o fluxo na ficha do candidato.')}a.stage_id=s.id;if(s.kind==='hired'||/contratad/i.test(s.name))a.status='hired';else if(s.kind==='rejected'||/reprovad/i.test(s.name))a.status='rejected';else a.status='active';audit('Candidato movimentado','Candidatura',`${nameFor(a)}: ${prev} → ${s.name}`);notify('Etapa atualizada e histórico registrado')}
function employeeDetail(id){const x=state.employees.find(e=>e.id===Number(id));if(!x)return;const p=state.development_plans.filter(p=>p.employee_id===x.id),g=state.performance_goals.filter(p=>p.employee_id===x.id),on=state.onboarding_items.filter(t=>t.employee_id===x.id);modal('Jornada · '+x.name,`<div class="person">${person(x.name)}<div><strong>${esc(x.job_title)}</strong><div class="detail">${esc(x.department)} · ${date(x.hire_date)}</div></div></div><div class="stats" style="margin:20px 0">${stat('☷','Integração',on.length)}${stat('↗','PDIs',p.length)}${stat('◎','Metas',g.length)}${stat('✓','Ativo',x.status==='active'?'Sim':'Não')}</div><div class="actions" style="margin-bottom:15px">${btn('◉ Matriz de competências','comp-open-employee','ghost',`data-id="${x.id}"`)}</div><h3>Planos em andamento</h3>${p.map(y=>`<div class="listItem"><div><strong>${esc(y.title)}</strong><div class="detail">${esc(y.competency)}</div></div><div style="width:140px">${progress(y.progress)}</div></div>`).join('')||'<p class="muted">Nenhum plano registrado.</p>'}`,null,true)}
function pdiDetail(id){const p=state.development_plans.find(p=>p.id===Number(id));if(!p)return;modal(p.title,`<div class="alert">${esc(employeeFor(p)?.name)} · ${esc(p.competency)} · Prazo: ${date(p.due_date)}</div><p>${esc(p.goal)}</p><div id="pdiActions">${(p.actions||[]).map((a,i)=>`<div class="listItem"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-pdi-action="${p.id}" data-index="${i}" ${a.done?'checked':''}/><span>${esc(a.title)}</span></label>${a.done?badge('Concluída','green'):badge('Pendente','amber')}</div>`).join('')}</div><p class="help">A conclusão muda a porcentagem calculada automaticamente.</p>`,null,true)}

function outputCSV(filename,items){if(!items.length)return notify('Nenhum registro para exportação',true);const cols=Object.keys(items[0]);const csv=[cols.join(';'),...items.map(r=>cols.map(k=>govCsvCell(r[k])).join(';'))].join('\r\n');download(filename,'\ufeff'+csv,'text/csv;charset=utf-8')}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function handleAction(action,el){if(action.startsWith('people-'))return peopleHandleAction(action,el);if(action==='leave-approve'||action==='leave-reject'){const l=state.leave_requests.find(x=>x.id===Number(el.dataset.id));if(!l)return;return peopleLeaveStep(l.id,l.status==='manager_approved'?'hr':'manager')}if(action.startsWith('gov-'))return govHandleAction(action,el);if(action.startsWith('eval-'))return evalHandleAction(action,el);if(action.startsWith('comp-'))return compHandleAction(action,el);const id=Number(el.dataset.id||0);switch(action){case 'go-analytics':return switchPage('reports');case 'comp-nav':return switchPage('competencies');case 'analytics-tab':analyticsTab=el.dataset.value;return render();case 'analytics-export-summary':return aExportCSV(`TalentFlow-KPIs-${today()}.csv`,aSummaryRecords());case 'analytics-export-detail':return aExportDetail();case 'analytics-export-drill':return aExportCSV(`TalentFlow-Detalhe-${today()}.csv`,window.analyticsDrillRows||[]);case 'analytics-print':return window.print();case 'analytics-drill':return aOpenDrill(el.dataset.drill,el.dataset.value);case 'nav-onboarding':return switchPage('onboarding');case 'nav-pdi':return switchPage('pdi');case 'job-new':return freshJob();case 'candidate-new':return freshCandidate();case 'employee-new':return newEmployee();case 'pdi-new':return newPDI();case 'leave-new':return newLeave();case 'course-new':return newCourse();case 'course-assign':return assignCourse();case 'goal-new':return newGoal();case 'onboarding-new':return newOnboarding();case 'interview-new':return newInterview(id);case 'open-pipeline':jobId=id;return switchPage('pipeline');case 'candidate-detail':return appDetail(id,Number(el.dataset.candidate||0));case 'employee-detail':return employeeDetail(id);case 'pdi-detail':return pdiDetail(id);case 'modal-close':return closeModal();case 'edit-job':{const j=state.jobs.find(x=>x.id===id);return modal('Editar vaga',`${field('title','Título',j.title)}${pick('status','Status',[['open','Aberta'],['closed','Fechada'],['archived','Arquivada']],j.status)}${field('location','Localização',j.location)}`,d=>{Object.assign(j,d);audit('Vaga alterada','Vaga',j.title);notify('Vaga atualizada')})}case 'leave-approve':case 'leave-reject':{const l=state.leave_requests.find(x=>x.id===id);if(l.status!=='pending')return;l.status=action==='leave-approve'?'approved':'rejected';audit('Ausência '+(l.status==='approved'?'aprovada':'recusada'),'Ausência',employeeFor(l)?.name);notify('Solicitação atualizada');return render()}case 'course-complete':{const x=state.learning_enrollments.find(x=>x.id===id);x.status='completed';audit('Treinamento concluído','Curso',employeeFor(x)?.name);notify('Conclusão registrada');return render()}case 'goal-update':{const x=state.performance_goals.find(x=>x.id===id);return modal('Atualizar resultado',`${field('actual_value','Resultado observado',x.actual_value,'number')}`,d=>{x.actual_value=Number(d.actual_value);audit('Meta atualizada','Desempenho',x.title);notify('Progresso salvo')})}case 'interview-score':{const iv=state.interviews.find(x=>x.id===id);return newScore(iv.application_id)}case 'score-new':return newScore(id);case 'message-new':return newMessage(id);case 'offer-new':return newOffer(id);case 'offer-accept':{const o=state.offers.find(o=>o.id===id);if(!o||o.status!=='sent')throw Error('Proposta não está aguardando aceite');o.status='accepted';audit('Proposta aceita (simulação)','Proposta',`Proposta ${id}`);notify('Aceite registrado. Agora é possível contratar.');closeModal();return render()}case 'offer-hire':{const o=state.offers.find(o=>o.id===id);if(!o||o.status!=='accepted')throw Error('Aceite da proposta é obrigatório');const a=state.applications.find(a=>a.id===o.application_id),c=state.candidates.find(c=>c.id===a.candidate_id),j=jobFor(a);if(state.employees.some(e=>e.application_id===a.id))throw Error('A candidatura já gerou um colaborador');state.employees.push({id:idFor('employees'),application_id:a.id,name:c.name,work_email:c.email,department:j?.department||'Geral',job_title:j?.title||c.title,status:'active',hire_date:o.start_date});a.status='hired';const st=state.job_stages.find(s=>s.job_id===a.job_id&&s.kind==='hired');if(st)a.stage_id=st.id;o.status='hired';audit('Contratação efetivada (demonstração)','Colaborador',c.name);notify('Colaborador criado a partir da candidatura');closeModal();return render()}case 'export-json':return download('TalentFlow-People-Dados-Locais.json',JSON.stringify(state,null,2),'application/json');case 'export-jobs':return outputCSV('TalentFlow-Vagas.csv',state.jobs);case 'reset':if(confirm('Restaurar os dados de demonstração? Todas as mudanças locais serão perdidas.')){state=clone(SEED);save();notify('Dados locais restaurados');return render()}break;}}
