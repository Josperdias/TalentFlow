name: android

on:
  push:
    branches: ['**']
    paths: ['apps/android/**', 'packages/design-tokens/**', 'VERSION', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'packages/design-tokens/**', 'VERSION', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (testes unitários + integração com API real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: tf_android }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: API real (migrações + seed de demonstração)
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tf_android
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          APP_ENV=development DEMO_SEED=true SERVE_LEGACY_WEB=false TF_LOGIN_IP_LIMIT=100000 \
            nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
      - name: Testes do :core (inclui RealApiTest contra a API real)
        working-directory: apps/android
        env: { TF_API_URL: 'http://127.0.0.1:8000' }
        run: ./gradlew -PcoreOnly=true :core:test --console=plain
      - name: Conferir que a integração real NÃO foi pulada
        working-directory: apps/android
        run: |
          python3 - <<'PY'
          import re, glob
          s = open(glob.glob('core/build/test-results/test/*RealApiTest.xml')[0], encoding='utf-8').read()
          m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', s)
          t, sk, f, e = map(int, m.groups())
          print(f'RealApiTest: testes={t} pulados={sk} falhas={f} erros={e}')
          assert t >= 3 and sk == 0 and f == 0 and e == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-test-reports, path: apps/android/core/build/reports/tests/test }

  apk:
    name: apk (debug nativo Kotlin/Compose)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (já vem no runner; aceitar licenças e garantir plataforma 35)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" | tail -3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de depuração
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Verificar APK (aapt2) e gerar checksum
        run: |
          APK=$(ls apps/android/app/build/outputs/apk/debug/*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|application-label:"
          unzip -l "$APK" | tail -1
          if unzip -l "$APK" | grep -qi "webview"; then echo "ERRO: APK referencia WebView"; exit 1; fi
          cp "$APK" "talentflow-android-v$(cat VERSION)-debug.apk"
          sha256sum "talentflow-android-v$(cat VERSION)-debug.apk" | tee "talentflow-android-v$(cat VERSION)-debug.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: talentflow-android-debug
          path: |
            talentflow-android-v*-debug.apk
            talentflow-android-v*-debug.apk.sha256
