name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: policy (sem WebView/Electron/segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clientes nativos não podem embrulhar o site
        run: bash scripts/check-native-policy.sh
      - name: Nenhum segredo versionado
        run: bash scripts/check-no-secrets.sh

  api:
    name: api (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: talentflow_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TF_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/talentflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: services/api/requirements-dev.txt }
      - name: Dependências
        working-directory: services/api
        run: pip install -r requirements-dev.txt
      - name: Migrações Alembic (subir, conferir deriva, descer e subir de novo)
        working-directory: services/api
        env: { DATABASE_URL: 'postgresql+psycopg://postgres:postgres@localhost:5432/postgres' }
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "create database mig_check"
          export DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/mig_check
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Testes da API em PostgreSQL
        working-directory: services/api
        run: python -m pytest -q
      - name: Contrato OpenAPI sem deriva
        run: |
          python scripts/export-openapi.py
          git diff --exit-code packages/contracts/openapi.json

  web:
    name: web (build, testes, E2E em navegador)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tokens de design sem deriva
        run: |
          node packages/design-tokens/build.mjs
          git diff --exit-code apps packages
      - name: Typecheck, testes e build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Pacote ZIP
        run: bash scripts/package-web.sh
      - name: Dependências do E2E
        run: |
          pip install -r services/api/requirements.txt playwright alembic "psycopg[binary]"
          playwright install --with-deps chromium
      - name: E2E do ZIP descompactado (Chromium -> servidor estático -> API -> PostgreSQL)
        env:
          TF_E2E_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          rm -rf /tmp/zip-site && mkdir /tmp/zip-site && unzip -q dist/talentflow-web-v*.zip -d /tmp/zip-site
          bash scripts/e2e-web.sh /tmp/zip-site docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: talentflow-web
          path: |
            dist/talentflow-web-v*.zip
            dist/talentflow-web-v*.zip.sha256
            docs/screenshots/*.png

  compose:
    name: compose (servidor em contêineres: subir, provisionar, backup/restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar .env de teste
        working-directory: infra
        run: |
          cp .env.example .env
          sed -i "s|^PGPASSWORD=.*|PGPASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^TRUSTED_ORIGINS=.*|TRUSTED_ORIGINS=https://rh.exemplo.test|" .env
      - name: Subir PostgreSQL + API (migrações no entrypoint)
        working-directory: infra
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/v1/health
      - name: Produção não serve HTML, UI legada nem contas de demonstração
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/workspace)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/auth/token -H 'Content-Type: application/json' -d '{"email":"admin@nexa.demo","password":"Demo@2026!","client":"cli"}')" = "401"
      - name: Provisionar empresa e administrador, entrar e criar uma vaga
        working-directory: infra
        run: |
          printf 'SenhaForte-Compose-2026!\n' | docker compose exec -T api python -m scripts.provision_admin --company "Empresa CI" --slug empresa-ci --email dono@empresa-ci.test
          TOK=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/token -H 'Content-Type: application/json' -d '{"email":"dono@empresa-ci.test","password":"SenhaForte-Compose-2026!","client":"cli"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -sf -X POST http://127.0.0.1:8000/api/v1/jobs -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{"title":"Vaga criada no teste do compose"}' | tee /tmp/job.json
          echo "$TOK" > /tmp/tok
      - name: Backup, destruir dados e restaurar
        working-directory: infra
        run: |
          ./backup.sh 1
          ls -l backups/*.dump
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "delete from audit_logs; delete from job_stages; delete from jobs;"'
          TOK=$(cat /tmp/tok)
          test "$(curl -sf http://127.0.0.1:8000/api/v1/jobs -H "Authorization: Bearer $TOK" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')" = "0"
          echo RESTAURAR | ./restore.sh "$(ls backups/*.dump | head -1)"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && break; sleep 2; done
          N=$(curl -sf http://127.0.0.1:8000/api/v1/jobs -H "Authorization: Bearer $TOK" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')
          echo "vagas após restaurar: $N"; test "$N" = "1"
      - name: Logs da API (em caso de falha)
        if: failure()
        working-directory: infra
        run: docker compose logs --tail=80 api db
