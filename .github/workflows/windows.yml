name: windows

on:
  push:
    branches: ['**']
    paths: ['apps/windows/**', 'packages/design-tokens/**', 'VERSION', '.github/workflows/windows.yml']
  pull_request:
    paths: ['apps/windows/**', 'packages/design-tokens/**', 'VERSION', '.github/workflows/windows.yml']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  core:
    name: core C# (testes unitários + integração com API real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: tf_windows }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: API real (migrações + seed de demonstração)
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tf_windows
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          # Atualização "publicada" de mentira (v99.0.0) para provar manifesto -> download autenticado -> SHA-256 de ponta a ponta.
          mkdir -p /tmp/updates && head -c 300000 /dev/urandom > /tmp/updates/TalentFlow-Setup-v99.0.0.exe
          printf '{"version":"99.0.0","file":"TalentFlow-Setup-v99.0.0.exe","sha256":"%s","notes":"teste"}' "$(sha256sum /tmp/updates/TalentFlow-Setup-v99.0.0.exe | cut -d' ' -f1)" > /tmp/updates/windows.json
          TF_UPDATES_DIR=/tmp/updates APP_ENV=development DEMO_SEED=true SERVE_LEGACY_WEB=false TF_LOGIN_IP_LIMIT=100000 \
            nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
      - name: Testes do Core (inclui RealApiTests contra a API real)
        working-directory: apps/windows
        env: { TF_API_URL: 'http://127.0.0.1:8000', TF_EXPECT_UPDATE: '1' }
        run: dotnet test TalentFlow.Core.Tests/TalentFlow.Core.Tests.csproj --logger "trx;LogFileName=results.trx"
      - name: Conferir que a integração real NÃO foi pulada
        working-directory: apps/windows
        run: |
          python3 - <<'PY'
          import re, glob
          s = open(glob.glob('TalentFlow.Core.Tests/TestResults/results.trx')[0], encoding='utf-8').read()
          real = re.findall(r'<UnitTestResult[^>]*testName="[^"]*RealApiTests[^"]*"[^>]*outcome="(\w+)"', s)
          print('RealApiTests:', real)
          assert len(real) >= 4 and all(o == 'Passed' for o in real)
          PY

  app:
    name: app WinUI 3 (publish autossuficiente + instalador .exe)
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Versão do produto
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          "PRODUCT_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publicar (WinUI 3 unpackaged, self-contained, x64)
        shell: pwsh
        run: |
          dotnet publish apps/windows/TalentFlow.Windows/TalentFlow.Windows.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o dist/windows-publish
          if (-not (Test-Path dist/windows-publish/TalentFlow.exe)) { throw "TalentFlow.exe não foi gerado" }
          $size = (Get-ChildItem dist/windows-publish -Recurse | Measure-Object Length -Sum).Sum / 1MB
          "Tamanho da publicação: {0:N1} MB" -f $size
          Get-ChildItem dist/windows-publish -Filter *.exe | Select-Object Name, Length
      - name: Sem navegador embutido (nosso código não referencia; binários não usados são removidos)
        shell: pwsh
        run: |
          # 1) Os assemblies que NÓS escrevemos não podem REFERENCIAR (assembly ou tipo) nenhum navegador embutido.
          #    Leitura precisa dos metadados do .NET (AssemblyRef/TypeRef), não busca de texto.
          $refs = foreach ($f in 'TalentFlow.dll','TalentFlow.Core.dll') {
            $stream = [System.IO.File]::OpenRead((Resolve-Path "dist/windows-publish/$f").Path)
            $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
            $md = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($pe)
            foreach ($h in $md.AssemblyReferences) { [pscustomobject]@{ File = $f; Kind = 'assembly'; Name = $md.GetString($md.GetAssemblyReference($h).Name) } }
            foreach ($h in $md.TypeReferences) { $r = $md.GetTypeReference($h); [pscustomobject]@{ File = $f; Kind = 'type'; Name = ('{0}.{1}' -f $md.GetString($r.Namespace), $md.GetString($r.Name)) } }
            $pe.Dispose(); $stream.Dispose()
          }
          "Referências inspecionadas (assemblies + tipos): $($refs.Count)"
          $refs | Where-Object { $_.Kind -eq 'assembly' } | Sort-Object Name -Unique | ForEach-Object { "  assembly: $($_.File) -> $($_.Name)" }
          # Falha apenas para motores alternativos (Electron/Chromium/CEF). Os tipos Microsoft.Web.WebView2.* que aparecem
          # em TalentFlow.dll vêm da PROJEÇÃO WinRT do Windows App SDK incluída em todo app WinUI 3 (não do nosso código,
          # que o scan de fontes check-native-policy.sh garante estar livre de WebView/WebView2). São apenas informados.
          $bad = $refs | Where-Object { $_.Name -match 'Electron|Chromium|Cef(Sharp|Glue)|libcef' }
          if ($bad) { $bad | Format-Table | Out-String; throw "Motor de navegador alternativo referenciado" }
          $wv = @($refs | Where-Object { $_.Name -match 'WebView2' }).Count
          "OK: sem Electron/Chromium/CEF. (Referências de tipo WebView2 geradas pela projeção do framework: $wv; uso no nosso código: 0, verificado no scan de fontes.)"
          # Diagnóstico (informativo): onde o texto aparece nos metadados gerados pelo XAML, se aparecer.
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes('dist/windows-publish/TalentFlow.dll'))
          [regex]::Matches($text, '.{0,30}(WebView|Electron|Chromium).{0,30}') | Select-Object -First 5 | ForEach-Object { "  (texto nos metadados) " + ($_.Value -replace '[^\x20-\x7E]', '.') }
          # 2) O Windows App SDK distribui o WebView2 como dependência do controle opcional, que o app não usa.
          #    Removemos esses binários do pacote (o teste de fumaça abaixo confirma que o app abre sem eles).
          $unused = Get-ChildItem dist/windows-publish -Recurse | Where-Object { $_.Name -match 'WebView2' }
          $unused | ForEach-Object { "removendo $($_.FullName.Substring((Resolve-Path dist/windows-publish).Path.Length))" ; Remove-Item $_.FullName -Force }
          # 3) Nenhum outro motor de navegador pode sobrar.
          $left = Get-ChildItem dist/windows-publish -Recurse | Where-Object { $_.Name -match 'WebView|Electron|chrome_|libcef|msedgewebview' }
          if ($left) { $left | ForEach-Object { $_.FullName }; throw "Componentes de navegador embutido encontrados" }
          "OK: publicação sem componentes de navegador embutido."
      - name: Teste de fumaça (abrir o app, capturar tela, fechar)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          $p = Start-Process -FilePath "dist/windows-publish/TalentFlow.exe" -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) { "Log:"; Get-Content "$env:LOCALAPPDATA\TalentFlow\talentflow.log" -ErrorAction SilentlyContinue; throw "O aplicativo encerrou (código $($p.ExitCode))" }
          "Processo vivo: PID $($p.Id), janela: '$($p.MainWindowTitle)', memória: $([int]($p.WorkingSet64/1MB)) MB"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshots/windows-conectar.png")
          Stop-Process -Id $p.Id -Force
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:PRODUCT_VERSION" "/DPublishDir=$((Resolve-Path dist/windows-publish).Path)" apps/windows/installer/TalentFlow.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador" }
      - name: Provar instalar e ATUALIZAR por cima (silencioso, por usuário)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $pub = (Resolve-Path dist/windows-publish).Path
          # Segundo instalador, só para o teste, com versão MAIOR (não entra nos artefatos).
          & $iscc "/DAppVersion=99.0.0" "/DPublishDir=$pub" "/O$((Join-Path $PWD 'dist-upgrade-test'))" apps/windows/installer/TalentFlow.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador de teste" }
          $dir = Join-Path $env:RUNNER_TEMP "TalentFlowInstalado"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{B7C9C0E2-4F51-4C0E-9D6B-5A1F7E2D3A10}_is1"
          $first = Get-ChildItem dist -Filter "TalentFlow-Setup-v*.exe" | Where-Object { $_.Name -notmatch 'v99' } | Select-Object -First 1
          $p = Start-Process $first.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalação falhou ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\TalentFlow.exe")) { throw "TalentFlow.exe não foi instalado" }
          $v1 = (Get-ItemProperty $key).DisplayVersion; "Instalado: $v1"
          if ($v1 -ne $env:PRODUCT_VERSION) { throw "Versão instalada inesperada: $v1" }
          "dummy-orfao" | Out-File "$dir\orfao.dll"   # simula arquivo de uma versão antiga
          $up = Get-ChildItem dist-upgrade-test -Filter "TalentFlow-Setup-v99*.exe" | Select-Object -First 1
          $p = Start-Process $up.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Atualização falhou ($($p.ExitCode))" }
          $v2 = (Get-ItemProperty $key).DisplayVersion; "Depois da atualização: $v2"
          if ($v2 -ne "99.0.0") { throw "A atualização por cima não trocou a versão ($v2)" }
          if (Test-Path "$dir\orfao.dll") { throw "DLL órfã da versão anterior não foi removida" }
          if (-not (Test-Path "$dir\TalentFlow.exe")) { throw "TalentFlow.exe sumiu após atualizar" }
          $entries = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { $_.PSChildName -like "{B7C9C0E2*" }
          if ($entries.Count -ne 1) { throw "Esperava 1 entrada de desinstalação, achei $($entries.Count)" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\TalentFlow.exe") { throw "Desinstalação não removeu o aplicativo" }
          "Instalar -> atualizar por cima -> desinstalar: OK"
          Remove-Item -Recurse -Force dist-upgrade-test
      - name: Manifesto de atualização (windows.json) para o seu servidor
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "TalentFlow-Setup-v*.exe" | Select-Object -First 1
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          [ordered]@{ version = $env:PRODUCT_VERSION; file = $exe.Name; sha256 = $sha; notes = "TalentFlow People $($env:PRODUCT_VERSION)" } | ConvertTo-Json | Out-File dist/windows.json -Encoding utf8
          Get-Content dist/windows.json
      - name: Pacote portátil (.zip) e checksums
        shell: pwsh
        run: |
          $v = $env:PRODUCT_VERSION
          Compress-Archive -Path dist/windows-publish/* -DestinationPath "dist/talentflow-windows-v$v-portable.zip"
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
            "$($_.Name)  $([int]($_.Length/1MB)) MB  sha256=$h"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: talentflow-windows
          path: |
            dist/TalentFlow-Setup-v*.exe
            dist/TalentFlow-Setup-v*.exe.sha256
            dist/talentflow-windows-v*-portable.zip
            dist/talentflow-windows-v*-portable.zip.sha256
            dist/windows.json
            screenshots/*.png
          if-no-files-found: warn
